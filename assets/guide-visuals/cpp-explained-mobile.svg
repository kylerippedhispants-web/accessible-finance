<svg xmlns="http://www.w3.org/2000/svg" width="360" height="606" viewBox="0 0 360 606" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Illustrative monthly CPP by start age</title>
  <desc id="description">Holding the underlying age-65 estimate at $1,000 and varying only the start-age factor gives $640 at 60, $1,000 at 65, and $1,420 at 70. Start at 60: $640. 36% reduction from the age-65 base Start at 65: $1,000. Hypothetical personal base amount Start at 70: $1,420. 42% increase; five years of payments forgone</desc>
  <rect width="360" height="606" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="640" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Start at 60</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$640</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#d8dfd2"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="108" width="140.620" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">36% reduction from the age-65</tspan><tspan x="24" dy="28">base</tspan></text>
      </g>
<g data-value="1000" data-row="1">
        <text x="24" y="232" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Start at 65</tspan></text>
        <text x="336" y="275" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$1,000</tspan></text>
        <path d="M24 289v32 M336 289v32" stroke="#d8dfd2"/>
        <rect x="24" y="294" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="294" width="219.718" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="345" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">Hypothetical personal base</tspan><tspan x="24" dy="28">amount</tspan></text>
      </g>
<g data-value="1420" data-row="2">
        <text x="24" y="418" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Start at 70</tspan></text>
        <text x="336" y="461" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$1,420</tspan></text>
        <path d="M24 475v32 M336 475v32" stroke="#d8dfd2"/>
        <rect x="24" y="480" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="480" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="531" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">42% increase; five years of</tspan><tspan x="24" dy="28">payments forgone</tspan></text>
      </g></g>
</svg>
