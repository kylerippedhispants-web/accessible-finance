<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" role="img" aria-labelledby="title description">
  <title id="title">Same order size, different control</title>
  <desc id="description">The market purchase fills 50 units for $1,002. A $20 limit fills only 30 units for $600 while the other 20 remain unfilled under the stated offers. Market purchase: 50 units / $1,002. Some units fill above the lowest ask. $20 buy limit: 30 units / $600. 20 units remain unfilled at these prices.</desc>
  <rect width="640" height="304" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g>
      <rect x="24" y="24" width="592" height="108" rx="10" fill="#eef5f0"/>
      
      <circle cx="58" cy="60" r="18" fill="#1d6b45"/>
      <text x="58" y="67" font-size="20" text-anchor="middle" fill="#fff">1</text>
      <text x="92" y="60" font-size="32" font-weight="600">Market purchase</text>
      <text x="92" y="103" font-size="36" fill="#1d6b45">50 units / $1,002</text>
    </g>
<g>
      <rect x="24" y="152" width="592" height="108" rx="10" fill="#f4f0e7"/>
      
      <circle cx="58" cy="188" r="18" fill="#8b642b"/>
      <text x="58" y="195" font-size="20" text-anchor="middle" fill="#fff">2</text>
      <text x="92" y="188" font-size="32" font-weight="600">$20 buy limit</text>
      <text x="92" y="231" font-size="36" fill="#8b642b">30 units / $600</text>
    </g></g>
</svg>
