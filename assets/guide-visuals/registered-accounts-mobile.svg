        <text x="46" y="67" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">Savings in a TFSA</tspan></text>
        <text x="46" y="113" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="46" dy="0">$1,000</tspan></text>
        <text x="46" y="160" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">Check access and deposit</tspan><tspan x="46" dy="28">protection</tspan></text>
      </g>
<g data-row="1">
        <rect x="24" y="235" width="312" height="195" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 249h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="278" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">GIC in a TFSA</tspan></text>
        <text x="46" y="324" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="46" dy="0">$1,000</tspan></text>
        <text x="46" y="371" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">Check maturity and</tspan><tspan x="46" dy="28">withdrawal restrictions</tspan></text>
      </g>
<g data-row="2">
