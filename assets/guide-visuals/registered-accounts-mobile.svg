        <path d="M46 460h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="489" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">Stock fund in a TFSA</tspan></text>
        <text x="46" y="535" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="46" dy="0">$1,000</tspan></text>
        <text x="46" y="582" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">Market value can rise or</tspan><tspan x="46" dy="28">fall</tspan></text>
