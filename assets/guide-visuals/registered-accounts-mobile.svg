<svg xmlns="http://www.w3.org/2000/svg" width="360" height="665" viewBox="0 0 360 665" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">One account type, three holdings</title>
  <desc id="description">Each TFSA holds $1,000, but accessible savings, a locked-in GIC, and a stock fund have different access and risk characteristics. Savings in a TFSA: $1,000. Check access and deposit protection GIC in a TFSA: $1,000. Check maturity and withdrawal restrictions Stock fund in a TFSA: $1,000. Market value can rise or fall</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
