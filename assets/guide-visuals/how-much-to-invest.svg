<svg xmlns="http://www.w3.org/2000/svg" width="640" height="282" viewBox="0 0 640 282" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">What happens to the $500 remainder?</title>
  <desc id="description">The $500 monthly remainder is divided into a $300 investment contribution and a $200 buffer. Investing: $300. Initial monthly contribution Buffer: $200. Room for variable spending</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="640" height="282" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-value="300" data-row="0">
        <text data-text-role="label" x="24" y="48" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Investing</tspan></text>
        <text data-text-role="value" x="616" y="48" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="616" dy="0">$300</tspan></text>
        <path d="M24 67v32 M616 67v32" stroke="#d8dfd2"/>
        <rect x="24" y="72" width="592" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="72" width="592.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="24" y="120" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">Initial monthly contribution</tspan></text>
      </g>
<g data-value="200" data-row="1">
        <text data-text-role="label" x="24" y="181" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Buffer</tspan></text>
        <text data-text-role="value" x="616" y="181" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="616" dy="0">$200</tspan></text>
        <path d="M24 200v32 M616 200v32" stroke="#d8dfd2"/>
