<svg xmlns="http://www.w3.org/2000/svg" width="640" height="549" viewBox="0 0 640 549" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Spendable money after the same growth</title>
  <desc id="description">The TFSA leaves $1,400. The RRSP leaves $1,600 at 20% withdrawal tax, $1,400 at 30%, or $1,200 at 40%. All start from the same $1,000 of pre-tax income. TFSA: $1,400. $700 doubles; withdrawal is tax-free RRSP at 20% tax: $1,600. $2,000 less $400 tax RRSP at 30% tax: $1,400. $2,000 less $600 tax RRSP at 40% tax: $1,200. $2,000 less $800 tax</desc>
  <rect width="640" height="549" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="1400" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">TFSA</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$1,400</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#d8dfd2"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="84" width="497.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">$700 doubles; withdrawal is tax-free</tspan></text>
      </g>
<g data-value="1600" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">RRSP at 20% tax</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$1,600</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#d8dfd2"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="208" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">$2,000 less $400 tax</tspan></text>
      </g>
<g data-value="1400" data-row="2">
        <text x="36" y="306" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">RRSP at 30% tax</tspan></text>
        <text x="604" y="308" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$1,400</tspan></text>
        <path d="M36 327v32 M604 327v32" stroke="#d8dfd2"/>
        <rect x="36" y="332" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="332" width="497.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="383" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">$2,000 less $600 tax</tspan></text>
      </g>
<g data-value="1200" data-row="3">
        <text x="36" y="430" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">RRSP at 40% tax</tspan></text>
        <text x="604" y="432" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$1,200</tspan></text>
        <path d="M36 451v32 M604 451v32" stroke="#d8dfd2"/>
        <rect x="36" y="456" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="456" width="426.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="507" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">$2,000 less $800 tax</tspan></text>
      </g></g>
</svg>
