<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title description">
  <title id="title">Spendable money after the same growth</title>
  <desc id="description">The TFSA leaves $1,400. The RRSP leaves $1,600 at 20% withdrawal tax, $1,400 at 30%, or $1,200 at 40%. All start from the same $1,000 of pre-tax income. TFSA: $1,400. $700 doubles; withdrawal is tax-free RRSP at 20% tax: $1,600. $2,000 less $400 tax RRSP at 30% tax: $1,400. $2,000 less $600 tax RRSP at 40% tax: $1,200. $2,000 less $800 tax</desc>
  <rect width="640" height="560" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g data-value="1400">
        <text x="32" y="56" font-size="34" font-weight="600">TFSA</text>
        <text x="608" y="96" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$1,400</text>
        <rect x="32" y="114" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="114" width="504.000" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="1600">
        <text x="32" y="184" font-size="34" font-weight="600">RRSP at 20% tax</text>
        <text x="608" y="224" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$1,600</text>
        <rect x="32" y="242" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="242" width="576.000" height="20" rx="4" fill="#8b642b"/>
      </g>
<g data-value="1400">
        <text x="32" y="312" font-size="34" font-weight="600">RRSP at 30% tax</text>
        <text x="608" y="352" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$1,400</text>
        <rect x="32" y="370" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="370" width="504.000" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="1200">
        <text x="32" y="440" font-size="34" font-weight="600">RRSP at 40% tax</text>
        <text x="608" y="480" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$1,200</text>
        <rect x="32" y="498" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="498" width="432.000" height="20" rx="4" fill="#8b642b"/>
      </g></g>
</svg>
