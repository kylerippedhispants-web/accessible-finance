<svg xmlns="http://www.w3.org/2000/svg" width="360" height="608" viewBox="0 0 360 608" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">A withdrawal does not refill room immediately</title>
  <desc id="description">Available room begins at $5,000, falls to $2,000 after a $3,000 contribution, and remains $2,000 after a $1,000 same-year withdrawal. Before contributing: $5,000 room. Verified unused room After contributing: $2,000 room. $3,000 contribution used room After withdrawing: $2,000 room. $1,000 is added back next calendar year</desc>
  <rect width="360" height="608" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <path d="M39 66V185" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 180 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="39" r="15" fill="#fcfcf7" stroke="#24664e"/>
        <text x="39" y="44" font-size="14" font-weight="600" fill="#24664e" text-anchor="middle"><tspan x="39" dy="0">1</tspan></text>
        <text x="78" y="45" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Before contributing</tspan></text>
        <text x="78" y="88" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$5,000 room</tspan></text>
        <text x="78" y="130" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">Verified unused room</tspan></text>
        <path d="M78 172H336" stroke="#dce4dc"/>
      </g>
<g data-row="1">
        <path d="M39 234V381" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 376 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="207" r="15" fill="#fcfcf7" stroke="#24664e"/>
        <text x="39" y="212" font-size="14" font-weight="600" fill="#24664e" text-anchor="middle"><tspan x="39" dy="0">2</tspan></text>
        <text x="78" y="213" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">After contributing</tspan></text>
        <text x="78" y="256" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$2,000 room</tspan></text>
        <text x="78" y="298" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">$3,000 contribution used</tspan><tspan x="78" dy="28">room</tspan></text>
        <path d="M78 368H336" stroke="#dce4dc"/>
      </g>
<g data-row="2">
        
        <circle cx="39" cy="403" r="15" fill="#24664e" stroke="#24664e"/>
        <text x="39" y="408" font-size="14" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="39" dy="0">3</tspan></text>
        <text x="78" y="409" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">After withdrawing</tspan></text>
        <text x="78" y="452" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$2,000 room</tspan></text>
        <text x="78" y="494" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">$1,000 is added back next</tspan><tspan x="78" dy="28">calendar year</tspan></text>
        
      </g></g>
</svg>
