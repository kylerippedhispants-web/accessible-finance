<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Balance after the same company loses 50%</title>
  <desc id="description">The single-company portfolio falls to $5,000. The equal-weight 20-company portfolio falls to $9,750 when only that company loses value. One company: $5,000. $5,000 loss on a $10,000 portfolio. 20 equal holdings: $9,750. $250 loss if the other 19 stay flat.</desc>
  <rect width="360" height="420" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="5000" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">One company</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$5,000</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#d8dfd2"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="108" width="160.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">$5,000 loss on a $10,000</tspan><tspan x="24" dy="28">portfolio.</tspan></text>
      </g>
<g data-value="9750" data-row="1">
        <text x="24" y="232" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">20 equal holdings</tspan></text>
        <text x="336" y="275" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$9,750</tspan></text>
        <path d="M24 289v32 M336 289v32" stroke="#d8dfd2"/>
        <rect x="24" y="294" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="294" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="345" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">$250 loss if the other 19</tspan><tspan x="24" dy="28">stay flat.</tspan></text>
      </g></g>
</svg>
