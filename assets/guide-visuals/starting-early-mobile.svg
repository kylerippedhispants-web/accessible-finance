<svg xmlns="http://www.w3.org/2000/svg" width="320" height="338" viewBox="0 0 320 338" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Value at age 55</title>
  <desc id="description">At an assumed 5% annual return, $1,000 deposited at age 30 grows to about $3,386 by age 55; the same deposit at age 40 grows to about $2,079. Deposit at age 30: $3,386. 25 years to compound. Deposit at age 40: $2,079. 15 years to compound.</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="320" height="338" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-value="3386" data-row="0">
        <text data-text-role="label" x="20" y="44" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Deposit at age 30</tspan></text>
        <text data-text-role="value" x="300" y="84" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$3,386</tspan></text>
        <path d="M20 95v32 M300 95v32" stroke="#d8dfd2"/>
        <rect x="20" y="100" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="100" width="280.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="148" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">25 years to compound.</tspan></text>
      </g>
<g data-value="2079" data-row="1">
        <text data-text-role="label" x="20" y="209" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Deposit at age 40</tspan></text>
        <text data-text-role="value" x="300" y="249" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$2,079</tspan></text>
        <path d="M20 260v32 M300 260v32" stroke="#d8dfd2"/>
        <rect x="20" y="265" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="265" width="171.920" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="313" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">15 years to compound.</tspan></text>
      </g></g>
</svg>
