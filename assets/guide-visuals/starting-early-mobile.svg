<svg xmlns="http://www.w3.org/2000/svg" width="360" height="364" viewBox="0 0 360 364" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Value at age 55</title>
  <desc id="description">At an assumed 5% annual return, $1,000 deposited at age 30 grows to about $3,386 by age 55; the same deposit at age 40 grows to about $2,079. Deposit at age 30: $3,386. 25 years to compound. Deposit at age 40: $2,079. 15 years to compound.</desc>
  <rect width="360" height="364" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="3386" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Deposit at age 30</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$3,386</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#dce4dc"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="108" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">25 years to compound.</tspan></text>
      </g>
<g data-value="2079" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Deposit at age 40</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$2,079</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#dce4dc"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="266" width="191.568" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">15 years to compound.</tspan></text>
      </g></g>
</svg>
