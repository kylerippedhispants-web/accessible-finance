<svg xmlns="http://www.w3.org/2000/svg" width="640" height="555" viewBox="0 0 640 555" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">From cash payment to extra shares</title>
  <desc id="description">A $0.40 payment on 100 shares provides $40. Reinvesting at $20 buys two shares, increasing the holding to 102 shares. Receive the dividend: $40 cash. 100 shares × $0.40. Reinvest at $20: 2 more shares. $40 ÷ $20. New holding: 102 shares. Future payments and prices can change.</desc>
  <rect width="640" height="555" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <path d="M51 78V190" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m47 185 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="51" cy="51" r="15" fill="#fcfcf7" stroke="#24664e"/>
        <text x="51" y="56" font-size="14" font-weight="600" fill="#24664e" text-anchor="middle"><tspan x="51" dy="0">1</tspan></text>
        <text x="90" y="57" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Receive the dividend</tspan></text>
        <text x="90" y="97" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">$40 cash</tspan></text>
        <text x="90" y="139" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">100 shares × $0.40.</tspan></text>
        <path d="M90 177H604" stroke="#dce4dc"/>
      </g>
<g data-row="1">
        <path d="M51 239V351" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m47 346 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="51" cy="212" r="15" fill="#fcfcf7" stroke="#24664e"/>
        <text x="51" y="217" font-size="14" font-weight="600" fill="#24664e" text-anchor="middle"><tspan x="51" dy="0">2</tspan></text>
        <text x="90" y="218" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Reinvest at $20</tspan></text>
        <text x="90" y="258" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">2 more shares</tspan></text>
        <text x="90" y="300" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">$40 ÷ $20.</tspan></text>
        <path d="M90 338H604" stroke="#dce4dc"/>
      </g>
<g data-row="2">
        
        <circle cx="51" cy="373" r="15" fill="#24664e" stroke="#24664e"/>
        <text x="51" y="378" font-size="14" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="51" dy="0">3</tspan></text>
        <text x="90" y="379" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">New holding</tspan></text>
        <text x="90" y="419" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">102 shares</tspan></text>
        <text x="90" y="461" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">Future payments and prices can change.</tspan></text>
        
      </g></g>
</svg>
