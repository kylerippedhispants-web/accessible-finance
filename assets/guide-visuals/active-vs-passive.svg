<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" role="img" aria-labelledby="title description">
  <title id="title">Gross performance is only the start</title>
  <desc id="description">The passive fund earns 6% before a 0.2% cost, leaving about 5.8%. The active fund earns 7.2% before a 1.5% cost, leaving about 5.7%. Passive example: 5.8% net. 6.0% gross − 0.2% cost. Active example: 5.7% net. 7.2% gross − 1.5% cost.</desc>
  <rect width="640" height="304" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g>
      <rect x="24" y="24" width="592" height="108" rx="10" fill="#eef5f0"/>
      
      <circle cx="58" cy="60" r="18" fill="#1d6b45"/>
      <text x="58" y="67" font-size="20" text-anchor="middle" fill="#fff">1</text>
      <text x="92" y="60" font-size="32" font-weight="600">Passive example</text>
      <text x="92" y="103" font-size="36" fill="#1d6b45">5.8% net</text>
    </g>
<g>
      <rect x="24" y="152" width="592" height="108" rx="10" fill="#f4f0e7"/>
      
      <circle cx="58" cy="188" r="18" fill="#8b642b"/>
      <text x="58" y="195" font-size="20" text-anchor="middle" fill="#fff">2</text>
      <text x="92" y="188" font-size="32" font-weight="600">Active example</text>
      <text x="92" y="231" font-size="36" fill="#8b642b">5.7% net</text>
    </g></g>
</svg>
