        <rect data-bar="true" x="20" y="478" width="56.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="526" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">Chosen priorities</tspan></text>
      </g>
<g data-value="900" data-row="3">
        <text data-text-role="label" x="20" y="587" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Flexible spending</tspan></text>
        <text data-text-role="value" x="300" y="627" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$900</tspan></text>
