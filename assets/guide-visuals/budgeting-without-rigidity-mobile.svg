<svg xmlns="http://www.w3.org/2000/svg" width="320" height="740" viewBox="0 0 320 740" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">A simple plan for $4,200 a month</title>
  <desc id="description">The monthly budget assigns $2,500 to essentials, $300 to irregular bills, $500 to goals, and $900 to flexible spending. Essentials: $2,500. Includes minimum debt payments Irregular bills: $300. $3,600 annual total divided by 12 Savings goals: $500. Chosen priorities Flexible spending: $900. About $208 a week, averaged over a year</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="320" height="740" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-value="2500" data-row="0">
        <text data-text-role="label" x="20" y="44" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Essentials</tspan></text>
        <text data-text-role="value" x="300" y="84" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$2,500</tspan></text>
        <path d="M20 95v32 M300 95v32" stroke="#d8dfd2"/>
        <rect x="20" y="100" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="100" width="280.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="148" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">Includes minimum debt</tspan><tspan x="20" dy="24">payments</tspan></text>
      </g>
<g data-value="300" data-row="1">
        <text data-text-role="label" x="20" y="233" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Irregular bills</tspan></text>
        <text data-text-role="value" x="300" y="273" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$300</tspan></text>
        <path d="M20 284v32 M300 284v32" stroke="#d8dfd2"/>
        <rect x="20" y="289" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="289" width="33.600" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="337" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">$3,600 annual total divided</tspan><tspan x="20" dy="24">by 12</tspan></text>
      </g>
<g data-value="500" data-row="2">
        <text data-text-role="label" x="20" y="422" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Savings goals</tspan></text>
        <text data-text-role="value" x="300" y="462" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$500</tspan></text>
