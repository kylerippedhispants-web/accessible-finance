<svg xmlns="http://www.w3.org/2000/svg" width="360" height="581" viewBox="0 0 360 581" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">Rule of 72 versus exact doubling time</title>
  <desc id="description">At 4%: 18 years by the shortcut, 17.67 exact. At 6%: 12 years versus 11.90. At 8%: 9 years versus 9.01. At 4% a year: 18 years. Exact: about 17.67 years. At 6% a year: 12 years. Exact: about 11.90 years. At 8% a year: 9 years. Exact: about 9.01 years.</desc>
  <rect width="360" height="581" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="24" y="24" width="312" height="167" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 38h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="67" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">At 4% a year</tspan></text>
        <text x="46" y="113" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">18 years</tspan></text>
        <text x="46" y="160" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">Exact: about 17.67 years.</tspan></text>
      </g>
<g data-row="1">
        <rect x="24" y="207" width="312" height="167" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 221h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="250" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">At 6% a year</tspan></text>
        <text x="46" y="296" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">12 years</tspan></text>
        <text x="46" y="343" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">Exact: about 11.90 years.</tspan></text>
      </g>
<g data-row="2">
        <rect x="24" y="390" width="312" height="167" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 404h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="433" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">At 8% a year</tspan></text>
        <text x="46" y="479" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">9 years</tspan></text>
        <text x="46" y="526" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">Exact: about 9.01 years.</tspan></text>
      </g></g>
</svg>
