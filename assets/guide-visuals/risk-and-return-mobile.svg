<svg xmlns="http://www.w3.org/2000/svg" width="360" height="550" viewBox="0 0 360 550" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Possible outcomes versus the average</title>
  <desc id="description">The two possible balances are $12,000 and $9,000. Their equally weighted average is $10,500, which is not itself an outcome in this model. Gain outcome: $12,000. 50% assumed chance; +20%. Loss outcome: $9,000. 50% assumed chance; −10%. Weighted average: $10,500. A calculation, not a guaranteed balance.</desc>
  <rect width="360" height="550" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="12000" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Gain outcome</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$12,000</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#dce4dc"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="108" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">50% assumed chance; +20%.</tspan></text>
      </g>
<g data-value="9000" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Loss outcome</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$9,000</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#dce4dc"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="266" width="234.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">50% assumed chance; −10%.</tspan></text>
      </g>
<g data-value="10500" data-row="2">
        <text x="24" y="362" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Weighted average</tspan></text>
        <text x="336" y="405" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$10,500</tspan></text>
        <path d="M24 419v32 M336 419v32" stroke="#dce4dc"/>
        <rect x="24" y="424" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="424" width="273.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="475" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">A calculation, not a</tspan><tspan x="24" dy="28">guaranteed balance.</tspan></text>
      </g></g>
</svg>
