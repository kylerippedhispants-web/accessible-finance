<svg xmlns="http://www.w3.org/2000/svg" width="320" height="527" viewBox="0 0 320 527" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Possible outcomes versus the average</title>
  <desc id="description">The two possible balances are $12,000 and $9,000. Their equally weighted average is $10,500, which is not itself an outcome in this model. Gain outcome: $12,000. 50% assumed chance; +20%. Loss outcome: $9,000. 50% assumed chance; −10%. Weighted average: $10,500. A calculation, not a guaranteed balance.</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="320" height="527" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-value="12000" data-row="0">
        <text data-text-role="label" x="20" y="44" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Gain outcome</tspan></text>
        <text data-text-role="value" x="300" y="84" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$12,000</tspan></text>
        <path d="M20 95v32 M300 95v32" stroke="#d8dfd2"/>
        <rect x="20" y="100" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="100" width="280.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="148" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">50% assumed chance; +20%.</tspan></text>
      </g>
<g data-value="9000" data-row="1">
        <text data-text-role="label" x="20" y="209" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Loss outcome</tspan></text>
        <text data-text-role="value" x="300" y="249" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$9,000</tspan></text>
        <path d="M20 260v32 M300 260v32" stroke="#d8dfd2"/>
        <rect x="20" y="265" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="265" width="210.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="313" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">50% assumed chance; −10%.</tspan></text>
      </g>
<g data-value="10500" data-row="2">
        <text data-text-role="label" x="20" y="374" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Weighted average</tspan></text>
        <text data-text-role="value" x="300" y="414" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$10,500</tspan></text>
        <path d="M20 425v32 M300 425v32" stroke="#d8dfd2"/>
        <rect x="20" y="430" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="430" width="245.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="478" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">A calculation, not a</tspan><tspan x="20" dy="24">guaranteed balance.</tspan></text>
      </g></g>
</svg>
