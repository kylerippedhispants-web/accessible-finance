<svg xmlns="http://www.w3.org/2000/svg" width="360" height="454" viewBox="0 0 360 454" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">One $250 budget, two purchase methods</title>
  <desc id="description">At an assumed $25 mutual-fund price, all $250 buys ten units. At a $24 ETF execution price with whole units only, ten units cost $240 and $10 remains cash. Mutual-fund order: 10 units / $250. Calculated at the applicable $25 NAV. ETF order: 10 units / $240. $24 execution price; $10 cash remains.</desc>
  <rect width="360" height="454" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="24" y="24" width="312" height="195" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 38h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="67" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">Mutual-fund order</tspan></text>
        <text x="46" y="113" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">10 units / $250</tspan></text>
        <text x="46" y="160" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">Calculated at the</tspan><tspan x="46" dy="28">applicable $25 NAV.</tspan></text>
      </g>
<g data-row="1">
        <rect x="24" y="235" width="312" height="195" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 249h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="278" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">ETF order</tspan></text>
        <text x="46" y="324" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">10 units / $240</tspan></text>
        <text x="46" y="371" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">$24 execution price; $10</tspan><tspan x="46" dy="28">cash remains.</tspan></text>
      </g></g>
</svg>
