<svg xmlns="http://www.w3.org/2000/svg" width="320" height="426" viewBox="0 0 320 426" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">One $250 budget, two purchase methods</title>
  <desc id="description">At an assumed $25 mutual-fund price, all $250 buys ten units. At a $24 ETF execution price with whole units only, ten units cost $240 and $10 remains cash. Mutual-fund order: 10 units / $250. Calculated at the applicable $25 NAV. ETF order: 10 units / $240. $24 execution price; $10 cash remains.</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="320" height="426" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-row="0">
        <rect x="20" y="20" width="280" height="185" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M40 40h24" stroke="#24664e" stroke-width="2"/>
        <text data-text-role="label" x="40" y="68" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="40" dy="0">Mutual-fund order</tspan></text>
        <text data-text-role="value" x="40" y="108" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="40" dy="0">10 units / $250</tspan></text>
        <text data-text-role="detail" x="40" y="156" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="40" dy="0">Calculated at the</tspan><tspan x="40" dy="24">applicable $25 NAV.</tspan></text>
      </g>
<g data-row="1">
        <rect x="20" y="221" width="280" height="185" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M40 241h24" stroke="#24664e" stroke-width="2"/>
        <text data-text-role="label" x="40" y="269" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="40" dy="0">ETF order</tspan></text>
        <text data-text-role="value" x="40" y="309" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="40" dy="0">10 units / $240</tspan></text>
        <text data-text-role="detail" x="40" y="357" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="40" dy="0">$24 execution price; $10</tspan><tspan x="40" dy="24">cash remains.</tspan></text>
      </g></g>
</svg>
