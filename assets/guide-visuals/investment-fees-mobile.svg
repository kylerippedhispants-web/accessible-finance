<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Hypothetical balance after 20 years</title>
  <desc id="description">Under the simplified assumptions, the 0.20% annual-fee investment ends at about $30,883; the 1.50% annual-fee investment ends at about $24,117. 0.20% annual fee: $30,883. 5.80% net rate in this model. 1.50% annual fee: $24,117. 4.50% net rate in this model.</desc>
  <rect width="360" height="348" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="30883" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">0.20% annual fee</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$30,883</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#d8dfd2"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="108" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">5.80% net rate in this model.</tspan></text>
      </g>
<g data-value="24117" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">1.50% annual fee</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$24,117</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#d8dfd2"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="266" width="243.646" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">4.50% net rate in this model.</tspan></text>
      </g></g>
</svg>
