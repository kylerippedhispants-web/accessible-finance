<svg xmlns="http://www.w3.org/2000/svg" width="640" height="299" viewBox="0 0 640 299" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">One $250 budget, two purchase methods</title>
  <desc id="description">At an assumed $25 mutual-fund price, all $250 buys ten units. At a $24 ETF execution price with whole units only, ten units cost $240 and $10 remains cash. Mutual-fund order: 10 units / $250. Calculated at the applicable $25 NAV. ETF order: 10 units / $240. $24 execution price; $10 cash remains.</desc>
  <rect width="640" height="299" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="36" y="36" width="274" height="227" rx="8" fill="#fcfcf7" stroke="#dce4dc"/>
        <path d="M56 50h28" stroke="#24664e" stroke-width="2"/>
        <text x="56" y="79" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="56" dy="0">Mutual-fund order</tspan></text>
        <text x="56" y="122" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="56" dy="0">10 units /</tspan><tspan x="56" dy="42">$250</tspan></text>
        <text x="56" y="211" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="56" dy="0">Calculated at the</tspan><tspan x="56" dy="24">applicable $25 NAV.</tspan></text>
      </g>
<g data-row="1">
        <rect x="330" y="36" width="274" height="227" rx="8" fill="#fcfcf7" stroke="#dce4dc"/>
        <path d="M350 50h28" stroke="#24664e" stroke-width="2"/>
        <text x="350" y="79" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="350" dy="0">ETF order</tspan></text>
        <text x="350" y="122" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="350" dy="0">10 units /</tspan><tspan x="350" dy="42">$240</tspan></text>
        <text x="350" y="211" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="350" dy="0">$24 execution price; $10</tspan><tspan x="350" dy="24">cash remains.</tspan></text>
      </g></g>
</svg>
