<svg xmlns="http://www.w3.org/2000/svg" width="640" height="415" viewBox="0 0 640 415" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">The same percentage, a different base</title>
  <desc id="description">The portfolio begins at $10,000, falls 30% to $7,000, then gains 30% to $9,100, still below its starting value. Before the decline: $10,000. Starting balance After a 30% loss: $7,000. $3,000 below the start Then a 30% gain: $9,100. Still $900 below the start</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="640" height="415" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-value="10000" data-row="0">
        <text data-text-role="label" x="24" y="48" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Before the decline</tspan></text>
        <text data-text-role="value" x="616" y="48" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="616" dy="0">$10,000</tspan></text>
        <path d="M24 67v32 M616 67v32" stroke="#d8dfd2"/>
        <rect x="24" y="72" width="592" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="72" width="592.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="24" y="120" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">Starting balance</tspan></text>
      </g>
<g data-value="7000" data-row="1">
        <text data-text-role="label" x="24" y="181" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">After a 30% loss</tspan></text>
        <text data-text-role="value" x="616" y="181" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="616" dy="0">$7,000</tspan></text>
        <path d="M24 200v32 M616 200v32" stroke="#d8dfd2"/>
        <rect x="24" y="205" width="592" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="205" width="414.400" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="24" y="253" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">$3,000 below the start</tspan></text>
      </g>
<g data-value="9100" data-row="2">
        <text data-text-role="label" x="24" y="314" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Then a 30% gain</tspan></text>
        <text data-text-role="value" x="616" y="314" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="616" dy="0">$9,100</tspan></text>
        <path d="M24 333v32 M616 333v32" stroke="#d8dfd2"/>
        <rect x="24" y="338" width="592" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="338" width="538.720" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="24" y="386" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">Still $900 below the start</tspan></text>
      </g></g>
</svg>
