<svg xmlns="http://www.w3.org/2000/svg" width="640" height="444" viewBox="0 0 640 444" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">The same percentage, a different base</title>
  <desc id="description">The portfolio begins at $10,000, falls 30% to $7,000, then gains 30% to $9,100, still below its starting value. Before the decline: $10,000. Starting balance After a 30% loss: $7,000. $3,000 below the start Then a 30% gain: $9,100. Still $900 below the start</desc>
  <rect width="640" height="444" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="10000" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Before the decline</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$10,000</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#dce4dc"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="84" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">Starting balance</tspan></text>
      </g>
<g data-value="7000" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">After a 30% loss</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$7,000</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#dce4dc"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="208" width="397.600" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">$3,000 below the start</tspan></text>
      </g>
<g data-value="9100" data-row="2">
        <text x="36" y="306" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Then a 30% gain</tspan></text>
        <text x="604" y="308" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$9,100</tspan></text>
        <path d="M36 327v32 M604 327v32" stroke="#dce4dc"/>
        <rect x="36" y="332" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="332" width="516.880" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="383" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">Still $900 below the start</tspan></text>
      </g></g>
</svg>
