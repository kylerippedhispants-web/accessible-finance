<g data-value="1200" data-row="3">
        <text data-text-role="label" x="20" y="563" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">RRSP at 40% tax</tspan></text>
        <text data-text-role="value" x="300" y="603" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$1,200</tspan></text>
