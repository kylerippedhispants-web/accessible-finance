<svg xmlns="http://www.w3.org/2000/svg" width="320" height="692" viewBox="0 0 320 692" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Spendable money after the same growth</title>
  <desc id="description">The TFSA leaves $1,400. The RRSP leaves $1,600 at 20% withdrawal tax, $1,400 at 30%, or $1,200 at 40%. All start from the same $1,000 of pre-tax income. TFSA: $1,400. $700 doubles; withdrawal is tax-free RRSP at 20% tax: $1,600. $2,000 less $400 tax RRSP at 30% tax: $1,400. $2,000 less $600 tax RRSP at 40% tax: $1,200. $2,000 less $800 tax</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="320" height="692" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-value="1400" data-row="0">
        <text data-text-role="label" x="20" y="44" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">TFSA</tspan></text>
        <text data-text-role="value" x="300" y="84" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$1,400</tspan></text>
        <path d="M20 95v32 M300 95v32" stroke="#d8dfd2"/>
        <rect x="20" y="100" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="100" width="245.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="148" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">$700 doubles; withdrawal is</tspan><tspan x="20" dy="24">tax-free</tspan></text>
      </g>
<g data-value="1600" data-row="1">
        <text data-text-role="label" x="20" y="233" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">RRSP at 20% tax</tspan></text>
        <text data-text-role="value" x="300" y="273" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$1,600</tspan></text>
        <path d="M20 284v32 M300 284v32" stroke="#d8dfd2"/>
        <rect x="20" y="289" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="289" width="280.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="337" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">$2,000 less $400 tax</tspan></text>
      </g>
<g data-value="1400" data-row="2">
        <text data-text-role="label" x="20" y="398" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">RRSP at 30% tax</tspan></text>
        <text data-text-role="value" x="300" y="438" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$1,400</tspan></text>
