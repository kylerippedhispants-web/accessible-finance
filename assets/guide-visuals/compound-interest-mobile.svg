<svg xmlns="http://www.w3.org/2000/svg" width="360" height="534" viewBox="0 0 360 534" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">The balance that earns the next return</title>
  <desc id="description">With $1,000 initially and a constant 5% annual return, the year-end balances are $1,050, $1,102.50, and $1,157.63. End of year 1: $1,050. $50 earned during year 1. End of year 2: $1,102.50. $52.50 earned during year 2. End of year 3: $1,157.63. About $55.13 earned during year 3.</desc>
  <rect width="360" height="534" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="1050" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">End of year 1</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$1,050</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#d8dfd2"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="108" width="282.992" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">$50 earned during year 1.</tspan></text>
      </g>
<g data-value="1102.5" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">End of year 2</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$1,102.50</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#d8dfd2"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="266" width="297.142" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">$52.50 earned during year 2.</tspan></text>
      </g>
<g data-value="1157.63" data-row="2">
        <text x="24" y="362" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">End of year 3</tspan></text>
        <text x="336" y="405" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$1,157.63</tspan></text>
        <path d="M24 419v32 M336 419v32" stroke="#d8dfd2"/>
        <rect x="24" y="424" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="424" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="475" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">About $55.13 earned during</tspan><tspan x="24" dy="28">year 3.</tspan></text>
      </g></g>
</svg>
