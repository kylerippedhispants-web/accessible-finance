<svg xmlns="http://www.w3.org/2000/svg" width="640" height="555" viewBox="0 0 640 555" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">Same savings, different timelines</title>
  <desc id="description">Of $6,000, $3,000 is an accessible emergency reserve, $2,000 is for tuition in one year, and $1,000 is for a long-term goal. Emergency reserve: $3,000. Available when needed Tuition: $2,000. Needed in 12 months Long-term goal: $1,000. A separate investment decision</desc>
  <rect width="640" height="555" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="36" y="36" width="568" height="145" rx="8" fill="#fcfcf7" stroke="#dce4dc"/>
        <path d="M58 50h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="79" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">Emergency reserve</tspan></text>
        <text x="58" y="122" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="58" dy="0">$3,000</tspan></text>
        <text x="58" y="169" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">Available when needed</tspan></text>
      </g>
<g data-row="1">
        <rect x="36" y="197" width="568" height="145" rx="8" fill="#fcfcf7" stroke="#dce4dc"/>
        <path d="M58 211h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="240" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">Tuition</tspan></text>
        <text x="58" y="283" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="58" dy="0">$2,000</tspan></text>
        <text x="58" y="330" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">Needed in 12 months</tspan></text>
      </g>
<g data-row="2">
        <rect x="36" y="358" width="568" height="145" rx="8" fill="#fcfcf7" stroke="#dce4dc"/>
        <path d="M58 372h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="401" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">Long-term goal</tspan></text>
        <text x="58" y="444" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="58" dy="0">$1,000</tspan></text>
        <text x="58" y="491" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">A separate investment decision</tspan></text>
      </g></g>
</svg>
