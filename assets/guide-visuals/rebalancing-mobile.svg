<svg xmlns="http://www.w3.org/2000/svg" width="360" height="665" viewBox="0 0 360 665" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">Rebalancing with new money</title>
  <desc id="description">Before the contribution, stocks are $7,200 and bonds $3,800. Adding $1,000 to bonds makes the portfolio $7,200 stocks and $4,800 bonds, restoring a 60/40 mix. Before contributing: 65.5% / 34.5%. $7,200 stocks + $3,800 bonds New money to bonds: $1,000. No sale is needed in this example After contributing: 60% / 40%. $7,200 stocks + $4,800 bonds</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="360" height="665" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-row="0">
        <rect x="24" y="24" width="312" height="195" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 38h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="67" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">Before contributing</tspan></text>
        <text x="46" y="113" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="46" dy="0">65.5% / 34.5%</tspan></text>
        <text x="46" y="160" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">$7,200 stocks + $3,800</tspan><tspan x="46" dy="28">bonds</tspan></text>
      </g>
<g data-row="1">
        <rect x="24" y="235" width="312" height="195" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 249h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="278" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">New money to bonds</tspan></text>
        <text x="46" y="324" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="46" dy="0">$1,000</tspan></text>
        <text x="46" y="371" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">No sale is needed in this</tspan><tspan x="46" dy="28">example</tspan></text>
      </g>
<g data-row="2">
        <rect x="24" y="446" width="312" height="195" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 460h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="489" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">After contributing</tspan></text>
        <text x="46" y="535" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="46" dy="0">60% / 40%</tspan></text>
        <text x="46" y="582" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">$7,200 stocks + $4,800</tspan><tspan x="46" dy="28">bonds</tspan></text>
      </g></g>
</svg>
