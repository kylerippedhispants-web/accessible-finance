<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Annual deposits at $100 each</title>
  <desc id="description">Twenty-four twice-monthly deposits total $2,400; 26 biweekly deposits total $2,600. Twice a month: $2,400. 24 deposits × $100 Every two weeks: $2,600. 26 deposits × $100</desc>
  <rect width="640" height="320" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="2400" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Twice a month</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$2,400</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#d8dfd2"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="84" width="524.308" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">24 deposits × $100</tspan></text>
      </g>
<g data-value="2600" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Every two weeks</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$2,600</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#d8dfd2"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="208" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">26 deposits × $100</tspan></text>
      </g></g>
</svg>
