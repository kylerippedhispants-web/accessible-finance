<svg xmlns="http://www.w3.org/2000/svg" width="360" height="525" viewBox="0 0 360 525" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">A three-year bond payment schedule</title>
  <desc id="description">The promised payments are $40 at year one, $40 at year two, and $1,040 at year three. The final payment includes $1,000 of original principal. End of year 1: $40. Interest payment. End of year 2: $40. Interest payment. End of year 3: $1,040. $40 interest + $1,000 principal.</desc>
  <rect width="360" height="525" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <path d="M39 53V193" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 188 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="39" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="78" y="45" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">End of year 1</tspan></text>
        <text x="78" y="88" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$40</tspan></text>
        <text x="78" y="130" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">Interest payment.</tspan></text>
        <path d="M78 172H336" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M39 221V361" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 356 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="207" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="78" y="213" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">End of year 2</tspan></text>
        <text x="78" y="256" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$40</tspan></text>
        <text x="78" y="298" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">Interest payment.</tspan></text>
        <path d="M78 340H336" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
        <circle cx="39" cy="375" r="7" fill="#24664e" stroke="#24664e" stroke-width="1.5"/>
        <text x="78" y="381" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">End of year 3</tspan></text>
        <text x="78" y="424" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$1,040</tspan></text>
        <text x="78" y="466" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">$40 interest + $1,000</tspan><tspan x="78" dy="28">principal.</tspan></text>
        
      </g></g>
</svg>
