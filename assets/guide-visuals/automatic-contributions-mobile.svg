<svg xmlns="http://www.w3.org/2000/svg" width="360" height="364" viewBox="0 0 360 364" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Annual deposits at $100 each</title>
  <desc id="description">Twenty-four twice-monthly deposits total $2,400; 26 biweekly deposits total $2,600. Twice a month: $2,400. 24 deposits × $100 Every two weeks: $2,600. 26 deposits × $100</desc>
  <rect width="360" height="364" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="2400" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Twice a month</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$2,400</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#dce4dc"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="108" width="288.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">24 deposits × $100</tspan></text>
      </g>
<g data-value="2600" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Every two weeks</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$2,600</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#dce4dc"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="266" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">26 deposits × $100</tspan></text>
      </g></g>
</svg>
