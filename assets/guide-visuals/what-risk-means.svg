<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" role="img" aria-labelledby="title description">
  <title id="title">The tuition deadline stays the same</title>
  <desc id="description">The tuition goal is $12,000; after the hypothetical 25% loss, only $9,000 remains, leaving a $3,000 shortfall. Tuition goal: $12,000. Amount due in one year. After a 25% loss: $9,000. $3,000 below the goal.</desc>
  <rect width="640" height="304" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g data-value="12000">
        <text x="32" y="56" font-size="34" font-weight="600">Tuition goal</text>
        <text x="608" y="96" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$12,000</text>
        <rect x="32" y="114" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="114" width="576.000" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="9000">
        <text x="32" y="184" font-size="34" font-weight="600">After a 25% loss</text>
        <text x="608" y="224" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$9,000</text>
        <rect x="32" y="242" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="242" width="432.000" height="20" rx="4" fill="#8b642b"/>
      </g></g>
</svg>
