<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">Same order size, different control</title>
  <desc id="description">The market purchase fills 50 units for $1,002. A $20 limit fills only 30 units for $600 while the other 20 remain unfilled under the stated offers. Market purchase: 50 units / $1,002. Some units fill above the lowest ask. $20 buy limit: 30 units / $600. 20 units remain unfilled at these prices.</desc>
  <rect width="360" height="440" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="24" y="24" width="312" height="180" rx="8" fill="#fcfcf7" stroke="#dce4dc"/>
        <path d="M46 38h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="67" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">Market purchase</tspan></text>
        <text x="46" y="113" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">50 units / $1,002</tspan></text>
        <text x="46" y="160" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">Some units fill above the</tspan><tspan x="46" dy="28">lowest ask.</tspan></text>
      </g>
<g data-row="1">
        <rect x="24" y="220" width="312" height="180" rx="8" fill="#fcfcf7" stroke="#dce4dc"/>
        <path d="M46 234h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="263" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">$20 buy limit</tspan></text>
        <text x="46" y="309" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">30 units / $600</tspan></text>
        <text x="46" y="356" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">20 units remain unfilled</tspan><tspan x="46" dy="28">at these prices.</tspan></text>
      </g></g>
</svg>
