<svg xmlns="http://www.w3.org/2000/svg" width="640" height="555" viewBox="0 0 640 555" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">From impulse to an explicit choice</title>
  <desc id="description">Casey compares a $300 planned contribution with a $900 impulse trade, then pauses to review the extra $600 and the added concentration. Written plan: $300. Scheduled diversified contribution Headline impulse: $900. $600 extra and one-company risk Decision check: Pause and review. Name the evidence and the goal paying for it</desc>
  <rect width="640" height="555" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <path d="M51 78V190" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m47 185 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="51" cy="51" r="15" fill="#fffdf6" stroke="#24664e"/>
        <text x="51" y="56" font-size="14" font-weight="600" fill="#24664e" text-anchor="middle"><tspan x="51" dy="0">1</tspan></text>
        <text x="90" y="57" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Written plan</tspan></text>
        <text x="90" y="97" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">$300</tspan></text>
        <text x="90" y="139" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">Scheduled diversified contribution</tspan></text>
        <path d="M90 177H604" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M51 239V351" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m47 346 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="51" cy="212" r="15" fill="#fffdf6" stroke="#24664e"/>
        <text x="51" y="217" font-size="14" font-weight="600" fill="#24664e" text-anchor="middle"><tspan x="51" dy="0">2</tspan></text>
        <text x="90" y="218" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Headline impulse</tspan></text>
        <text x="90" y="258" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">$900</tspan></text>
        <text x="90" y="300" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">$600 extra and one-company risk</tspan></text>
        <path d="M90 338H604" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
        <circle cx="51" cy="373" r="15" fill="#24664e" stroke="#24664e"/>
        <text x="51" y="378" font-size="14" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="51" dy="0">3</tspan></text>
        <text x="90" y="379" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Decision check</tspan></text>
        <text x="90" y="419" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">Pause and review</tspan></text>
        <text x="90" y="461" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">Name the evidence and the goal paying for it</tspan></text>
        
      </g></g>
</svg>
