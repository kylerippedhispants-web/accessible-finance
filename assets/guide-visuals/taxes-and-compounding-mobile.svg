<svg xmlns="http://www.w3.org/2000/svg" width="360" height="404" viewBox="0 0 360 404" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">The same interest rate, different tax treatment</title>
  <desc id="description">After ten years, the assumed taxable account holds about $13,180 at 2.8% after annual tax; the TFSA holds about $14,802 at 4%. Taxable interest: $13,180. 2.8% after assumed annual tax. TFSA interest: $14,802. 4% retained under the stated assumptions.</desc>
  <rect width="360" height="404" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="13180" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Taxable interest</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$13,180</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#d8dfd2"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="108" width="277.811" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">2.8% after assumed annual</tspan><tspan x="24" dy="28">tax.</tspan></text>
      </g>
<g data-value="14802" data-row="1">
        <text x="24" y="232" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">TFSA interest</tspan></text>
        <text x="336" y="275" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$14,802</tspan></text>
        <path d="M24 289v32 M336 289v32" stroke="#d8dfd2"/>
        <rect x="24" y="294" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="294" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="345" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">4% retained under the stated</tspan><tspan x="24" dy="28">assumptions.</tspan></text>
      </g></g>
</svg>
