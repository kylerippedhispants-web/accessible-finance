<svg xmlns="http://www.w3.org/2000/svg" width="360" height="364" viewBox="0 0 360 364" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Illustrative balance after one year</title>
  <desc id="description">At the same 7% gross return, a $20,000 investment ends at approximately $21,360 after a 0.2% cost or $21,160 after a 1.2% cost. Index example: $21,360. 7% gross minus 0.2% costs Active example: $21,160. 7% gross minus 1.2% costs</desc>
  <rect width="360" height="364" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="21360" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Index example</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$21,360</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#d8dfd2"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="108" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">7% gross minus 0.2% costs</tspan></text>
      </g>
<g data-value="21160" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Active example</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$21,160</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#d8dfd2"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="266" width="309.079" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">7% gross minus 1.2% costs</tspan></text>
      </g></g>
</svg>
