<svg xmlns="http://www.w3.org/2000/svg" width="360" height="506" viewBox="0 0 360 506" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">The same percentage, a different base</title>
  <desc id="description">The portfolio begins at $10,000, falls 30% to $7,000, then gains 30% to $9,100, still below its starting value. Before the decline: $10,000. Starting balance After a 30% loss: $7,000. $3,000 below the start Then a 30% gain: $9,100. Still $900 below the start</desc>
  <rect width="360" height="506" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="10000" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Before the decline</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$10,000</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#d8dfd2"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="108" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">Starting balance</tspan></text>
      </g>
<g data-value="7000" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">After a 30% loss</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$7,000</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#d8dfd2"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="266" width="218.400" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">$3,000 below the start</tspan></text>
      </g>
<g data-value="9100" data-row="2">
        <text x="24" y="362" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Then a 30% gain</tspan></text>
        <text x="336" y="405" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$9,100</tspan></text>
        <path d="M24 419v32 M336 419v32" stroke="#d8dfd2"/>
        <rect x="24" y="424" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="424" width="283.920" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="475" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">Still $900 below the start</tspan></text>
      </g></g>
</svg>
