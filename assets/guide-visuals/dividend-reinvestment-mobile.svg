<svg xmlns="http://www.w3.org/2000/svg" width="320" height="467" viewBox="0 0 320 467" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">From cash payment to extra shares</title>
  <desc id="description">A $0.40 payment on 100 shares provides $40. Reinvesting at $20 buys two shares, increasing the holding to 102 shares. Receive the dividend: $40 cash. 100 shares × $0.40. Reinvest at $20: 2 more shares. $40 ÷ $20. New holding: 102 shares. Future payments and prices can change.</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="320" height="467" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-row="0">
        <path d="M35 49V166" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m31 161 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="35" cy="35" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text data-text-role="label" x="60" y="40" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="60" dy="0">Receive the dividend</tspan></text>
        <text data-text-role="value" x="60" y="80" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="60" dy="0">$40 cash</tspan></text>
        <text data-text-role="detail" x="60" y="128" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="60" dy="0">100 shares × $0.40.</tspan></text>
        <path d="M60 145H300" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M35 194V311" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m31 306 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="35" cy="180" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text data-text-role="label" x="60" y="185" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="60" dy="0">Reinvest at $20</tspan></text>
        <text data-text-role="value" x="60" y="225" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="60" dy="0">2 more shares</tspan></text>
        <text data-text-role="detail" x="60" y="273" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="60" dy="0">$40 ÷ $20.</tspan></text>
        <path d="M60 290H300" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
        <circle cx="35" cy="325" r="7" fill="#24664e" stroke="#24664e" stroke-width="1.5"/>
        <text data-text-role="label" x="60" y="330" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="60" dy="0">New holding</tspan></text>
        <text data-text-role="value" x="60" y="370" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="60" dy="0">102 shares</tspan></text>
        <text data-text-role="detail" x="60" y="418" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="60" dy="0">Future payments and</tspan><tspan x="60" dy="24">prices can change.</tspan></text>
        
      </g></g>
</svg>
