<svg xmlns="http://www.w3.org/2000/svg" width="320" height="627" viewBox="0 0 320 627" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">A $4,000 deductible contribution</title>
  <desc id="description">At an assumed 30% marginal rate, a $4,000 deductible contribution reduces tax by $1,200, leaving an after-tax cash cost of $2,800. Into the RRSP: $4,000. Contribution, with sufficient room Tax reduction: $1,200. $4,000 × illustrative 30% rate After-tax cash cost: $2,800. $4,000 minus the tax reduction</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
