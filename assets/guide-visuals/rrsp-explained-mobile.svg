<svg xmlns="http://www.w3.org/2000/svg" width="360" height="636" viewBox="0 0 360 636" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">A $4,000 deductible contribution</title>
  <desc id="description">At an assumed 30% marginal rate, a $4,000 deductible contribution reduces tax by $1,200, leaving an after-tax cash cost of $2,800. Into the RRSP: $4,000. Contribution, with sufficient room Tax reduction: $1,200. $4,000 × illustrative 30% rate After-tax cash cost: $2,800. $4,000 minus the tax reduction</desc>
  <rect width="360" height="636" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="24" y="24" width="312" height="180" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 38h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="67" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">Into the RRSP</tspan></text>
        <text x="46" y="113" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">$4,000</tspan></text>
        <text x="46" y="160" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">Contribution, with</tspan><tspan x="46" dy="28">sufficient room</tspan></text>
      </g>
<g data-row="1">
        <rect x="24" y="220" width="312" height="180" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 234h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="263" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">Tax reduction</tspan></text>
        <text x="46" y="309" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">$1,200</tspan></text>
        <text x="46" y="356" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">$4,000 × illustrative 30%</tspan><tspan x="46" dy="28">rate</tspan></text>
      </g>
<g data-row="2">
        <rect x="24" y="416" width="312" height="180" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 430h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="459" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">After-tax cash cost</tspan></text>
        <text x="46" y="505" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">$2,800</tspan></text>
        <text x="46" y="552" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">$4,000 minus the tax</tspan><tspan x="46" dy="28">reduction</tspan></text>
      </g></g>
</svg>
