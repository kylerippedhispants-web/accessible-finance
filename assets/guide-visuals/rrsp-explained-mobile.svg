    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="320" height="627" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-row="0">
        <rect x="20" y="20" width="280" height="185" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M40 40h24" stroke="#24664e" stroke-width="2"/>
        <text data-text-role="label" x="40" y="68" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="40" dy="0">Into the RRSP</tspan></text>
        <text data-text-role="value" x="40" y="108" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="40" dy="0">$4,000</tspan></text>
        <text data-text-role="detail" x="40" y="156" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="40" dy="0">Contribution, with</tspan><tspan x="40" dy="24">sufficient room</tspan></text>
      </g>
<g data-row="1">
        <rect x="20" y="221" width="280" height="185" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M40 241h24" stroke="#24664e" stroke-width="2"/>
        <text data-text-role="label" x="40" y="269" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="40" dy="0">Tax reduction</tspan></text>
        <text data-text-role="value" x="40" y="309" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="40" dy="0">$1,200</tspan></text>
        <text data-text-role="detail" x="40" y="357" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="40" dy="0">$4,000 × illustrative 30%</tspan><tspan x="40" dy="24">rate</tspan></text>
      </g>
<g data-row="2">
        <rect x="20" y="422" width="280" height="185" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M40 442h24" stroke="#24664e" stroke-width="2"/>
        <text data-text-role="label" x="40" y="470" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="40" dy="0">After-tax cash cost</tspan></text>
        <text data-text-role="value" x="40" y="510" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="40" dy="0">$2,800</tspan></text>
        <text data-text-role="detail" x="40" y="558" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="40" dy="0">$4,000 minus the tax</tspan><tspan x="40" dy="24">reduction</tspan></text>
