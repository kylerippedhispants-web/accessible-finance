<svg xmlns="http://www.w3.org/2000/svg" width="640" height="301" viewBox="0 0 640 301" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Hypothetical balance after 20 years</title>
  <desc id="description">Under the simplified assumptions, the 0.20% annual-fee investment ends at about $30,883; the 1.50% annual-fee investment ends at about $24,117. 0.20% annual fee: $30,883. 5.80% net rate in this model. 1.50% annual fee: $24,117. 4.50% net rate in this model.</desc>
  <rect width="640" height="301" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="30883" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">0.20% annual fee</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$30,883</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#d8dfd2"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="84" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">5.80% net rate in this model.</tspan></text>
      </g>
<g data-value="24117" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">1.50% annual fee</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$24,117</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#d8dfd2"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="208" width="443.560" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">4.50% net rate in this model.</tspan></text>
      </g></g>
</svg>
