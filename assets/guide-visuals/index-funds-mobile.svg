<svg xmlns="http://www.w3.org/2000/svg" width="360" height="522" viewBox="0 0 360 522" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Where the $1,000 is exposed</title>
  <desc id="description">The fictional index places $500 in Company A, $300 in Company B, and $200 in Company C. Company A accounts for half the investment. Company A: $500. 50% of the index. Company B: $300. 30% of the index. Company C: $200. 20% of the index.</desc>
  <rect width="360" height="522" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="500" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Company A</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$500</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#d8dfd2"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="108" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">50% of the index.</tspan></text>
      </g>
<g data-value="300" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Company B</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$300</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#d8dfd2"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="266" width="187.200" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">30% of the index.</tspan></text>
      </g>
<g data-value="200" data-row="2">
        <text x="24" y="362" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Company C</tspan></text>
        <text x="336" y="405" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$200</tspan></text>
        <path d="M24 419v32 M336 419v32" stroke="#d8dfd2"/>
        <rect x="24" y="424" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="424" width="124.800" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="475" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">20% of the index.</tspan></text>
      </g></g>
</svg>
