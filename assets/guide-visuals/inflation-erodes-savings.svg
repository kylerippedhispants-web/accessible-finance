<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" role="img" aria-labelledby="title description">
  <title id="title">After three hypothetical years</title>
  <desc id="description">An $8,000 purchase growing at 3% annually costs about $8,742 after three years. Savings growing at 2% reach about $8,490, leaving a roughly $252 gap. Savings balance: $8,490. 2% annual growth after tax and fees Purchase price: $8,742. 3% annual price increase</desc>
  <rect width="640" height="304" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g data-value="8490">
        <text x="32" y="56" font-size="34" font-weight="600">Savings balance</text>
        <text x="608" y="96" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$8,490</text>
        <rect x="32" y="114" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="114" width="559.396" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="8742">
        <text x="32" y="184" font-size="34" font-weight="600">Purchase price</text>
        <text x="608" y="224" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$8,742</text>
        <rect x="32" y="242" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="242" width="576.000" height="20" rx="4" fill="#8b642b"/>
      </g></g>
</svg>
