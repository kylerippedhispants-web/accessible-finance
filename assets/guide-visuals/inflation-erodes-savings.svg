<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">After three hypothetical years</title>
  <desc id="description">An $8,000 purchase growing at 3% annually costs about $8,742 after three years. Savings growing at 2% reach about $8,490, leaving a roughly $252 gap. Savings balance: $8,490. 2% annual growth after tax and fees Purchase price: $8,742. 3% annual price increase</desc>
  <rect width="640" height="320" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="8490" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Savings balance</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$8,490</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#dce4dc"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="84" width="551.627" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">2% annual growth after tax and fees</tspan></text>
      </g>
<g data-value="8742" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Purchase price</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$8,742</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#dce4dc"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="208" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">3% annual price increase</tspan></text>
      </g></g>
</svg>
