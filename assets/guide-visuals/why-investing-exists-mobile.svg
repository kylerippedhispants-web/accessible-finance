<svg xmlns="http://www.w3.org/2000/svg" width="360" height="581" viewBox="0 0 360 581" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">Where the purchase money goes</title>
  <desc id="description">At issue, $1,000 moves from the first investor to the company. At resale, $980 moves from the second investor to the first investor; the company receives no new money. Original issue: $1,000. First investor pays the company. Later resale: $980. Second investor pays the first investor. Company at resale: $0 new funding. The existing bond changes owners.</desc>
  <rect width="360" height="581" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <path d="M39 53V221" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 216 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="39" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="78" y="45" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Original issue</tspan></text>
        <text x="78" y="88" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$1,000</tspan></text>
        <text x="78" y="130" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">First investor pays the</tspan><tspan x="78" dy="28">company.</tspan></text>
        <path d="M78 200H336" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M39 249V417" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 412 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="235" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="78" y="241" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Later resale</tspan></text>
        <text x="78" y="284" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$980</tspan></text>
        <text x="78" y="326" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">Second investor pays the</tspan><tspan x="78" dy="28">first investor.</tspan></text>
        <path d="M78 396H336" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
        <circle cx="39" cy="431" r="7" fill="#24664e" stroke="#24664e" stroke-width="1.5"/>
        <text x="78" y="437" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Company at resale</tspan></text>
        <text x="78" y="480" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$0 new funding</tspan></text>
        <text x="78" y="522" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">The existing bond changes</tspan><tspan x="78" dy="28">owners.</tspan></text>
        
      </g></g>
</svg>
