    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="640" height="451" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-row="0">
        <path d="M39 53V170" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 165 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="39" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text data-text-role="label" x="64" y="44" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="64" dy="0">Original issue</tspan></text>
        <text data-text-role="value" x="64" y="84" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="64" dy="0">$1,000</tspan></text>
        <text data-text-role="detail" x="64" y="132" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="64" dy="0">First investor pays the company.</tspan></text>
        <path d="M64 149H616" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M39 198V315" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 310 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="184" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text data-text-role="label" x="64" y="189" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="64" dy="0">Later resale</tspan></text>
        <text data-text-role="value" x="64" y="229" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="64" dy="0">$980</tspan></text>
        <text data-text-role="detail" x="64" y="277" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="64" dy="0">Second investor pays the first investor.</tspan></text>
        <path d="M64 294H616" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
        <circle cx="39" cy="329" r="7" fill="#24664e" stroke="#24664e" stroke-width="1.5"/>
        <text data-text-role="label" x="64" y="334" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="64" dy="0">Company at resale</tspan></text>
        <text data-text-role="value" x="64" y="374" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="64" dy="0">$0 new funding</tspan></text>
        <text data-text-role="detail" x="64" y="422" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="64" dy="0">The existing bond changes owners.</tspan></text>
        
