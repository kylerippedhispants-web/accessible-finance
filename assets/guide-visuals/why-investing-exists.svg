<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432" role="img" aria-labelledby="title description">
  <title id="title">Where the purchase money goes</title>
  <desc id="description">At issue, $1,000 moves from the first investor to the company. At resale, $980 moves from the second investor to the first investor; the company receives no new money. Original issue: $1,000. First investor pays the company. Later resale: $980. Second investor pays the first investor. Company at resale: $0 new funding. The existing bond changes owners.</desc>
  <rect width="640" height="432" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g>
      <rect x="24" y="24" width="592" height="108" rx="10" fill="#eef5f0"/>
      <path d="M58 132v18m-5-5 5 5 5-5" fill="none" stroke="#8b642b" stroke-width="2"/>
      <circle cx="58" cy="60" r="18" fill="#1d6b45"/>
      <text x="58" y="67" font-size="20" text-anchor="middle" fill="#fff">1</text>
      <text x="92" y="60" font-size="32" font-weight="600">Original issue</text>
      <text x="92" y="103" font-size="36" fill="#1d6b45">$1,000</text>
    </g>
<g>
      <rect x="24" y="152" width="592" height="108" rx="10" fill="#f4f0e7"/>
      <path d="M58 260v18m-5-5 5 5 5-5" fill="none" stroke="#8b642b" stroke-width="2"/>
      <circle cx="58" cy="188" r="18" fill="#8b642b"/>
      <text x="58" y="195" font-size="20" text-anchor="middle" fill="#fff">2</text>
      <text x="92" y="188" font-size="32" font-weight="600">Later resale</text>
      <text x="92" y="231" font-size="36" fill="#8b642b">$980</text>
    </g>
<g>
      <rect x="24" y="280" width="592" height="108" rx="10" fill="#eef5f0"/>
      
      <circle cx="58" cy="316" r="18" fill="#1d6b45"/>
      <text x="58" y="323" font-size="20" text-anchor="middle" fill="#fff">3</text>
      <text x="92" y="316" font-size="32" font-weight="600">Company at resale</text>
      <text x="92" y="359" font-size="36" fill="#1d6b45">$0 new funding</text>
    </g></g>
</svg>
