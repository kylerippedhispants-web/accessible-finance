<svg xmlns="http://www.w3.org/2000/svg" width="640" height="503" viewBox="0 0 640 503" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">Where the purchase money goes</title>
  <desc id="description">At issue, $1,000 moves from the first investor to the company. At resale, $980 moves from the second investor to the first investor; the company receives no new money. Original issue: $1,000. First investor pays the company. Later resale: $980. Second investor pays the first investor. Company at resale: $0 new funding. The existing bond changes owners.</desc>
  <rect width="640" height="503" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <path d="M51 65V198" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m47 193 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="51" cy="51" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="90" y="57" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Original issue</tspan></text>
        <text x="90" y="97" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">$1,000</tspan></text>
        <text x="90" y="139" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">First investor pays the company.</tspan></text>
        <path d="M90 177H604" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M51 226V359" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m47 354 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="51" cy="212" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="90" y="218" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Later resale</tspan></text>
        <text x="90" y="258" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">$980</tspan></text>
        <text x="90" y="300" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">Second investor pays the first investor.</tspan></text>
        <path d="M90 338H604" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
        <circle cx="51" cy="373" r="7" fill="#24664e" stroke="#24664e" stroke-width="1.5"/>
        <text x="90" y="379" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Company at resale</tspan></text>
        <text x="90" y="419" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">$0 new funding</tspan></text>
        <text x="90" y="461" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">The existing bond changes owners.</tspan></text>
        
      </g></g>
</svg>
