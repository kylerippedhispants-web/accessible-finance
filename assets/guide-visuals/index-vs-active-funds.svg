<svg xmlns="http://www.w3.org/2000/svg" width="640" height="301" viewBox="0 0 640 301" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Illustrative balance after one year</title>
  <desc id="description">At the same 7% gross return, a $20,000 investment ends at approximately $21,360 after a 0.2% cost or $21,160 after a 1.2% cost. Index example: $21,360. 7% gross minus 0.2% costs Active example: $21,160. 7% gross minus 1.2% costs</desc>
