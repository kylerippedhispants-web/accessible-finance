<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" role="img" aria-labelledby="title description">
  <title id="title">Illustrative balance after one year</title>
  <desc id="description">At the same 7% gross return, a $20,000 investment ends at approximately $21,360 after a 0.2% cost or $21,160 after a 1.2% cost. Index example: $21,360. 7% gross minus 0.2% costs Active example: $21,160. 7% gross minus 1.2% costs</desc>
  <rect width="640" height="304" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g data-value="21360">
        <text x="32" y="56" font-size="34" font-weight="600">Index example</text>
        <text x="608" y="96" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$21,360</text>
        <rect x="32" y="114" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="114" width="576.000" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="21160">
        <text x="32" y="184" font-size="34" font-weight="600">Active example</text>
        <text x="608" y="224" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$21,160</text>
        <rect x="32" y="242" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="242" width="570.607" height="20" rx="4" fill="#8b642b"/>
      </g></g>
</svg>
