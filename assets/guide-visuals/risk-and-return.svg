<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432" role="img" aria-labelledby="title description">
  <title id="title">Possible outcomes versus the average</title>
  <desc id="description">The two possible balances are $12,000 and $9,000. Their equally weighted average is $10,500, which is not itself an outcome in this model. Gain outcome: $12,000. 50% assumed chance; +20%. Loss outcome: $9,000. 50% assumed chance; −10%. Weighted average: $10,500. A calculation, not a guaranteed balance.</desc>
  <rect width="640" height="432" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g data-value="12000">
        <text x="32" y="56" font-size="34" font-weight="600">Gain outcome</text>
        <text x="608" y="96" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$12,000</text>
        <rect x="32" y="114" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="114" width="576.000" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="9000">
        <text x="32" y="184" font-size="34" font-weight="600">Loss outcome</text>
        <text x="608" y="224" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$9,000</text>
        <rect x="32" y="242" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="242" width="432.000" height="20" rx="4" fill="#8b642b"/>
      </g>
<g data-value="10500">
        <text x="32" y="312" font-size="34" font-weight="600">Weighted average</text>
        <text x="608" y="352" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$10,500</text>
        <rect x="32" y="370" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="370" width="504.000" height="20" rx="4" fill="#1d6b45"/>
      </g></g>
</svg>
