<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" role="img" aria-labelledby="title description">
  <title id="title">Balance after the same company loses 50%</title>
  <desc id="description">The single-company portfolio falls to $5,000. The equal-weight 20-company portfolio falls to $9,750 when only that company loses value. One company: $5,000. $5,000 loss on a $10,000 portfolio. 20 equal holdings: $9,750. $250 loss if the other 19 stay flat.</desc>
  <rect width="640" height="304" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g data-value="5000">
        <text x="32" y="56" font-size="34" font-weight="600">One company</text>
        <text x="608" y="96" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$5,000</text>
        <rect x="32" y="114" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="114" width="295.385" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="9750">
        <text x="32" y="184" font-size="34" font-weight="600">20 equal holdings</text>
        <text x="608" y="224" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$9,750</text>
        <rect x="32" y="242" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="242" width="576.000" height="20" rx="4" fill="#8b642b"/>
      </g></g>
</svg>
