<svg xmlns="http://www.w3.org/2000/svg" width="640" height="301" viewBox="0 0 640 301" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Balance after the same company loses 50%</title>
  <desc id="description">The single-company portfolio falls to $5,000. The equal-weight 20-company portfolio falls to $9,750 when only that company loses value. One company: $5,000. $5,000 loss on a $10,000 portfolio. 20 equal holdings: $9,750. $250 loss if the other 19 stay flat.</desc>
  <rect width="640" height="301" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="5000" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">One company</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$5,000</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#d8dfd2"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="84" width="291.282" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">$5,000 loss on a $10,000 portfolio.</tspan></text>
      </g>
<g data-value="9750" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">20 equal holdings</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$9,750</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#d8dfd2"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="208" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">$250 loss if the other 19 stay flat.</tspan></text>
      </g></g>
</svg>
