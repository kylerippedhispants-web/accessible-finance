<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432" role="img" aria-labelledby="title description">
  <title id="title">Contribution to qualifying withdrawal</title>
  <desc id="description">Avery contributes $3,000, receives an illustrative $900 tax reduction, and later withdraws a $3,150 balance tax-free if all qualifying conditions are met. Cash contribution: $3,000. Eligibility and room checked first Illustrative tax effect: $900 less tax. Full deduction at an assumed 30% rate Qualifying withdrawal: $3,150. Tax-free only when all conditions are met</desc>
  <rect width="640" height="432" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g>
      <rect x="24" y="24" width="592" height="108" rx="10" fill="#eef5f0"/>
      <path d="M58 132v18m-5-5 5 5 5-5" fill="none" stroke="#8b642b" stroke-width="2"/>
      <circle cx="58" cy="60" r="18" fill="#1d6b45"/>
      <text x="58" y="67" font-size="20" text-anchor="middle" fill="#fff">1</text>
      <text x="92" y="60" font-size="32" font-weight="600">Cash contribution</text>
      <text x="92" y="103" font-size="36" fill="#1d6b45">$3,000</text>
    </g>
<g>
      <rect x="24" y="152" width="592" height="108" rx="10" fill="#f4f0e7"/>
      <path d="M58 260v18m-5-5 5 5 5-5" fill="none" stroke="#8b642b" stroke-width="2"/>
      <circle cx="58" cy="188" r="18" fill="#8b642b"/>
      <text x="58" y="195" font-size="20" text-anchor="middle" fill="#fff">2</text>
      <text x="92" y="188" font-size="32" font-weight="600">Illustrative tax effect</text>
      <text x="92" y="231" font-size="36" fill="#8b642b">$900 less tax</text>
    </g>
<g>
      <rect x="24" y="280" width="592" height="108" rx="10" fill="#eef5f0"/>
      
      <circle cx="58" cy="316" r="18" fill="#1d6b45"/>
      <text x="58" y="323" font-size="20" text-anchor="middle" fill="#fff">3</text>
      <text x="92" y="316" font-size="32" font-weight="600">Qualifying withdrawal</text>
      <text x="92" y="359" font-size="36" fill="#1d6b45">$3,150</text>
    </g></g>
</svg>
