<svg xmlns="http://www.w3.org/2000/svg" width="640" height="503" viewBox="0 0 640 503" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">Contribution to qualifying withdrawal</title>
  <desc id="description">Avery contributes $3,000, receives an illustrative $900 tax reduction, and later withdraws a $3,150 balance tax-free if all qualifying conditions are met. Cash contribution: $3,000. Eligibility and room checked first Illustrative tax effect: $900 less tax. Full deduction at an assumed 30% rate Qualifying withdrawal: $3,150. Tax-free only when all conditions are met</desc>
  <rect width="640" height="503" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <path d="M51 65V198" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m47 193 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="51" cy="51" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="90" y="57" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Cash contribution</tspan></text>
        <text x="90" y="97" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">$3,000</tspan></text>
        <text x="90" y="139" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">Eligibility and room checked first</tspan></text>
        <path d="M90 177H604" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M51 226V359" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m47 354 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="51" cy="212" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="90" y="218" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Illustrative tax effect</tspan></text>
        <text x="90" y="258" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">$900 less tax</tspan></text>
        <text x="90" y="300" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">Full deduction at an assumed 30% rate</tspan></text>
        <path d="M90 338H604" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
        <circle cx="51" cy="373" r="7" fill="#24664e" stroke="#24664e" stroke-width="1.5"/>
        <text x="90" y="379" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">Qualifying withdrawal</tspan></text>
        <text x="90" y="419" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="90" dy="0">$3,150</tspan></text>
        <text x="90" y="461" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">Tax-free only when all conditions are met</tspan></text>
        
      </g></g>
</svg>
