<svg xmlns="http://www.w3.org/2000/svg" width="640" height="415" viewBox="0 0 640 415" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Where the $1,000 is exposed</title>
  <desc id="description">The fictional index places $500 in Company A, $300 in Company B, and $200 in Company C. Company A accounts for half the investment. Company A: $500. 50% of the index. Company B: $300. 30% of the index. Company C: $200. 20% of the index.</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="640" height="415" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-value="500" data-row="0">
        <text data-text-role="label" x="24" y="48" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Company A</tspan></text>
        <text data-text-role="value" x="616" y="48" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="616" dy="0">$500</tspan></text>
        <path d="M24 67v32 M616 67v32" stroke="#d8dfd2"/>
        <rect x="24" y="72" width="592" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="72" width="592.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="24" y="120" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">50% of the index.</tspan></text>
      </g>
<g data-value="300" data-row="1">
        <text data-text-role="label" x="24" y="181" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Company B</tspan></text>
        <text data-text-role="value" x="616" y="181" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="616" dy="0">$300</tspan></text>
        <path d="M24 200v32 M616 200v32" stroke="#d8dfd2"/>
        <rect x="24" y="205" width="592" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="205" width="355.200" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="24" y="253" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">30% of the index.</tspan></text>
      </g>
<g data-value="200" data-row="2">
        <text data-text-role="label" x="24" y="314" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Company C</tspan></text>
        <text data-text-role="value" x="616" y="314" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="616" dy="0">$200</tspan></text>
        <path d="M24 333v32 M616 333v32" stroke="#d8dfd2"/>
        <rect x="24" y="338" width="592" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="338" width="236.800" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="24" y="386" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">20% of the index.</tspan></text>
      </g></g>
