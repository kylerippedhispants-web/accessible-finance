<svg xmlns="http://www.w3.org/2000/svg" width="640" height="444" viewBox="0 0 640 444" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Where the $1,000 is exposed</title>
  <desc id="description">The fictional index places $500 in Company A, $300 in Company B, and $200 in Company C. Company A accounts for half the investment. Company A: $500. 50% of the index. Company B: $300. 30% of the index. Company C: $200. 20% of the index.</desc>
  <rect width="640" height="444" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="500" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Company A</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$500</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#d8dfd2"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="84" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">50% of the index.</tspan></text>
      </g>
<g data-value="300" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Company B</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$300</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#d8dfd2"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="208" width="340.800" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">30% of the index.</tspan></text>
      </g>
<g data-value="200" data-row="2">
        <text x="36" y="306" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Company C</tspan></text>
        <text x="604" y="308" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$200</tspan></text>
        <path d="M36 327v32 M604 327v32" stroke="#d8dfd2"/>
        <rect x="36" y="332" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="332" width="227.200" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="383" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">20% of the index.</tspan></text>
      </g></g>
</svg>
