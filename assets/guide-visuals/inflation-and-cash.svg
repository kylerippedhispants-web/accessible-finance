<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432" role="img" aria-labelledby="title description">
  <title id="title">Purchasing power after five years</title>
  <desc id="description">Starting purchasing power is $5,000. After five years of 3% inflation, cash earning 2% has about $4,762 of purchasing power; cash earning nothing has about $4,313. Starting value: $5,000. Today&apos;s purchasing power. Cash earning 2%: $4,762. After five years at 3% inflation. Cash earning 0%: $4,313. After five years at 3% inflation.</desc>
  <rect width="640" height="432" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g data-value="5000">
        <text x="32" y="56" font-size="34" font-weight="600">Starting value</text>
        <text x="608" y="96" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$5,000</text>
        <rect x="32" y="114" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="114" width="576.000" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="4762">
        <text x="32" y="184" font-size="34" font-weight="600">Cash earning 2%</text>
        <text x="608" y="224" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$4,762</text>
        <rect x="32" y="242" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="242" width="548.582" height="20" rx="4" fill="#8b642b"/>
      </g>
<g data-value="4313">
        <text x="32" y="312" font-size="34" font-weight="600">Cash earning 0%</text>
        <text x="608" y="352" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$4,313</text>
        <rect x="32" y="370" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="370" width="496.858" height="20" rx="4" fill="#1d6b45"/>
      </g></g>
</svg>
