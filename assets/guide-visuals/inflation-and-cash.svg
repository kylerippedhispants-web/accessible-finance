<svg xmlns="http://www.w3.org/2000/svg" width="640" height="444" viewBox="0 0 640 444" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Purchasing power after five years</title>
  <desc id="description">Starting purchasing power is $5,000. After five years of 3% inflation, cash earning 2% has about $4,762 of purchasing power; cash earning nothing has about $4,313. Starting value: $5,000. Today&apos;s purchasing power. Cash earning 2%: $4,762. After five years at 3% inflation. Cash earning 0%: $4,313. After five years at 3% inflation.</desc>
  <rect width="640" height="444" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="5000" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Starting value</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$5,000</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#dce4dc"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="84" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">Today&apos;s purchasing power.</tspan></text>
      </g>
<g data-value="4762" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Cash earning 2%</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$4,762</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#dce4dc"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="208" width="540.963" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">After five years at 3% inflation.</tspan></text>
      </g>
<g data-value="4313" data-row="2">
        <text x="36" y="306" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Cash earning 0%</tspan></text>
        <text x="604" y="308" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$4,313</tspan></text>
        <path d="M36 327v32 M604 327v32" stroke="#dce4dc"/>
        <rect x="36" y="332" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="332" width="489.957" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="383" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">After five years at 3% inflation.</tspan></text>
      </g></g>
</svg>
