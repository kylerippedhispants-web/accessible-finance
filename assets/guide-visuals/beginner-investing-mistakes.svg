<svg xmlns="http://www.w3.org/2000/svg" width="640" height="549" viewBox="0 0 640 549" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Exposure to the same company</title>
  <desc id="description">The four funds hold $200, $150, $100, and $50 of the same company, adding to $500 of a $2,000 portfolio. Fund A: $200. 40% of a $500 holding Fund B: $150. 30% of a $500 holding Fund C: $100. 20% of a $500 holding Fund D: $50. 10% of a $500 holding</desc>
  <rect width="640" height="549" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="200" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Fund A</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$200</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#d8dfd2"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="84" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">40% of a $500 holding</tspan></text>
      </g>
<g data-value="150" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Fund B</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$150</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#d8dfd2"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="208" width="426.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">30% of a $500 holding</tspan></text>
      </g>
<g data-value="100" data-row="2">
        <text x="36" y="306" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Fund C</tspan></text>
        <text x="604" y="308" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$100</tspan></text>
        <path d="M36 327v32 M604 327v32" stroke="#d8dfd2"/>
        <rect x="36" y="332" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="332" width="284.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="383" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">20% of a $500 holding</tspan></text>
      </g>
<g data-value="50" data-row="3">
        <text x="36" y="430" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Fund D</tspan></text>
        <text x="604" y="432" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$50</tspan></text>
        <path d="M36 451v32 M604 451v32" stroke="#d8dfd2"/>
        <rect x="36" y="456" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="456" width="142.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="507" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">10% of a $500 holding</tspan></text>
      </g></g>
</svg>
