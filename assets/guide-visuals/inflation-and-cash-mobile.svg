<svg xmlns="http://www.w3.org/2000/svg" width="360" height="578" viewBox="0 0 360 578" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Purchasing power after five years</title>
  <desc id="description">Starting purchasing power is $5,000. After five years of 3% inflation, cash earning 2% has about $4,762 of purchasing power; cash earning nothing has about $4,313. Starting value: $5,000. Today&apos;s purchasing power. Cash earning 2%: $4,762. After five years at 3% inflation. Cash earning 0%: $4,313. After five years at 3% inflation.</desc>
  <rect width="360" height="578" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="5000" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Starting value</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$5,000</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#dce4dc"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="108" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">Today&apos;s purchasing power.</tspan></text>
      </g>
<g data-value="4762" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Cash earning 2%</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$4,762</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#dce4dc"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="266" width="297.149" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">After five years at 3%</tspan><tspan x="24" dy="28">inflation.</tspan></text>
      </g>
<g data-value="4313" data-row="2">
        <text x="24" y="390" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Cash earning 0%</tspan></text>
        <text x="336" y="433" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$4,313</tspan></text>
        <path d="M24 447v32 M336 447v32" stroke="#dce4dc"/>
        <rect x="24" y="452" width="312" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="24" y="452" width="269.131" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="503" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">After five years at 3%</tspan><tspan x="24" dy="28">inflation.</tspan></text>
      </g></g>
</svg>
