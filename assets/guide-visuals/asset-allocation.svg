<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" role="img" aria-labelledby="title description">
  <title id="title">The portfolio before and after the scenario</title>
  <desc id="description">A $10,000 portfolio split 60/40 ends at $8,280 when stocks lose 30% and bonds gain 2%, a 17.2% total decline. Starting portfolio: $10,000. $6,000 stocks + $4,000 bonds After the scenario: $8,280. $4,200 stocks + $4,080 bonds</desc>
  <rect width="640" height="304" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g data-value="10000">
        <text x="32" y="56" font-size="34" font-weight="600">Starting portfolio</text>
        <text x="608" y="96" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$10,000</text>
        <rect x="32" y="114" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="114" width="576.000" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="8280">
        <text x="32" y="184" font-size="34" font-weight="600">After the scenario</text>
        <text x="608" y="224" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$8,280</text>
        <rect x="32" y="242" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="242" width="476.928" height="20" rx="4" fill="#8b642b"/>
      </g></g>
</svg>
