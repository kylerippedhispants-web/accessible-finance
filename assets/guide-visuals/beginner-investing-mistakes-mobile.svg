<svg xmlns="http://www.w3.org/2000/svg" width="320" height="668" viewBox="0 0 320 668" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">Exposure to the same company</title>
  <desc id="description">The four funds hold $200, $150, $100, and $50 of the same company, adding to $500 of a $2,000 portfolio. Fund A: $200. 40% of a $500 holding Fund B: $150. 30% of a $500 holding Fund C: $100. 20% of a $500 holding Fund D: $50. 10% of a $500 holding</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="320" height="668" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-value="200" data-row="0">
        <text data-text-role="label" x="20" y="44" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Fund A</tspan></text>
        <text data-text-role="value" x="300" y="84" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$200</tspan></text>
        <path d="M20 95v32 M300 95v32" stroke="#d8dfd2"/>
        <rect x="20" y="100" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="100" width="280.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="148" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">40% of a $500 holding</tspan></text>
      </g>
<g data-value="150" data-row="1">
        <text data-text-role="label" x="20" y="209" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Fund B</tspan></text>
        <text data-text-role="value" x="300" y="249" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$150</tspan></text>
        <path d="M20 260v32 M300 260v32" stroke="#d8dfd2"/>
        <rect x="20" y="265" width="280" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="20" y="265" width="210.000" height="22" rx="3" fill="#24664e"/>
        <text data-text-role="detail" x="20" y="313" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="20" dy="0">30% of a $500 holding</tspan></text>
      </g>
<g data-value="100" data-row="2">
        <text data-text-role="label" x="20" y="374" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="20" dy="0">Fund C</tspan></text>
        <text data-text-role="value" x="300" y="414" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="300" dy="0">$100</tspan></text>
        <path d="M20 425v32 M300 425v32" stroke="#d8dfd2"/>
