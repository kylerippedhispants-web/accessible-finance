<svg xmlns="http://www.w3.org/2000/svg" width="360" height="552" viewBox="0 0 360 552" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">How the unit count shrinks</title>
  <desc id="description">Ten units at $100 fall to $80 and are sold for $800. After the price recovers to $100, that $800 buys only eight units. Before the decline: 10 units. 10 × $100 = $1,000. Sell at $80: $800 cash. 10 × $80 = $800. Buy back at $100: 8 units. $800 ÷ $100 = 8.</desc>
  <rect width="360" height="552" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <path d="M39 66V185" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 180 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="39" r="15" fill="#fcfcf7" stroke="#24664e"/>
        <text x="39" y="44" font-size="14" font-weight="600" fill="#24664e" text-anchor="middle"><tspan x="39" dy="0">1</tspan></text>
        <text x="78" y="45" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Before the decline</tspan></text>
        <text x="78" y="88" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">10 units</tspan></text>
        <text x="78" y="130" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">10 × $100 = $1,000.</tspan></text>
        <path d="M78 172H336" stroke="#dce4dc"/>
      </g>
<g data-row="1">
        <path d="M39 234V353" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 348 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="207" r="15" fill="#fcfcf7" stroke="#24664e"/>
        <text x="39" y="212" font-size="14" font-weight="600" fill="#24664e" text-anchor="middle"><tspan x="39" dy="0">2</tspan></text>
        <text x="78" y="213" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Sell at $80</tspan></text>
        <text x="78" y="256" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$800 cash</tspan></text>
        <text x="78" y="298" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">10 × $80 = $800.</tspan></text>
        <path d="M78 340H336" stroke="#dce4dc"/>
      </g>
<g data-row="2">
        
        <circle cx="39" cy="375" r="15" fill="#24664e" stroke="#24664e"/>
        <text x="39" y="380" font-size="14" font-weight="600" fill="#fff" text-anchor="middle"><tspan x="39" dy="0">3</tspan></text>
        <text x="78" y="381" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Buy back at $100</tspan></text>
        <text x="78" y="424" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">8 units</tspan></text>
        <text x="78" y="466" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">$800 ÷ $100 = 8.</tspan></text>
        
      </g></g>
</svg>
