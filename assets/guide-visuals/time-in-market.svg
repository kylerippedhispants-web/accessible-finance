<svg xmlns="http://www.w3.org/2000/svg" width="640" height="451" viewBox="0 0 640 451" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">How the unit count shrinks</title>
  <desc id="description">Ten units at $100 fall to $80 and are sold for $800. After the price recovers to $100, that $800 buys only eight units. Before the decline: 10 units. 10 × $100 = $1,000. Sell at $80: $800 cash. 10 × $80 = $800. Buy back at $100: 8 units. $800 ÷ $100 = 8.</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="640" height="451" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-row="0">
        <path d="M39 53V170" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 165 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="39" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text data-text-role="label" x="64" y="44" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="64" dy="0">Before the decline</tspan></text>
        <text data-text-role="value" x="64" y="84" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="64" dy="0">10 units</tspan></text>
        <text data-text-role="detail" x="64" y="132" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="64" dy="0">10 × $100 = $1,000.</tspan></text>
        <path d="M64 149H616" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M39 198V315" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 310 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="184" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text data-text-role="label" x="64" y="189" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="64" dy="0">Sell at $80</tspan></text>
        <text data-text-role="value" x="64" y="229" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="64" dy="0">$800 cash</tspan></text>
        <text data-text-role="detail" x="64" y="277" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="64" dy="0">10 × $80 = $800.</tspan></text>
        <path d="M64 294H616" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
        <circle cx="39" cy="329" r="7" fill="#24664e" stroke="#24664e" stroke-width="1.5"/>
        <text data-text-role="label" x="64" y="334" font-size="18" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="64" dy="0">Buy back at $100</tspan></text>
        <text data-text-role="value" x="64" y="374" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="64" dy="0">8 units</tspan></text>
        <text data-text-role="detail" x="64" y="422" font-size="16" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="64" dy="0">$800 ÷ $100 = 8.</tspan></text>
        
      </g></g>
</svg>
