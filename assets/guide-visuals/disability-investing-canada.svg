<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">A withdrawal has two parts</title>
  <desc id="description">In this hypothetical RDSP withdrawal, $600 is paid out and $1,800 of grants or bonds is repaid, reducing the plan by $2,400 in total. Payment out: $600. Before any tax on the payment Grant/bond repayment: $1,800. $3 repaid for each $1 withdrawn</desc>
  <rect width="640" height="320" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="600" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Payment out</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$600</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#d8dfd2"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="84" width="189.333" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">Before any tax on the payment</tspan></text>
      </g>
<g data-value="1800" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Grant/bond repayment</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$1,800</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#d8dfd2"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="208" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">$3 repaid for each $1 withdrawn</tspan></text>
      </g></g>
</svg>
