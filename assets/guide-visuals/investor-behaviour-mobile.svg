<svg xmlns="http://www.w3.org/2000/svg" width="360" height="581" viewBox="0 0 360 581" data-layout="flow" role="img" aria-labelledby="title description">
  <title id="title">From impulse to an explicit choice</title>
  <desc id="description">Casey compares a $300 planned contribution with a $900 impulse trade, then pauses to review the extra $600 and the added concentration. Written plan: $300. Scheduled diversified contribution Headline impulse: $900. $600 extra and one-company risk Decision check: Pause and review. Name the evidence and the goal paying for it</desc>
  <rect width="360" height="581" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <path d="M39 53V221" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 216 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="39" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="78" y="45" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Written plan</tspan></text>
        <text x="78" y="88" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$300</tspan></text>
        <text x="78" y="130" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">Scheduled diversified</tspan><tspan x="78" dy="28">contribution</tspan></text>
        <path d="M78 200H336" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M39 249V417" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m35 412 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="39" cy="235" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="78" y="241" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Headline impulse</tspan></text>
        <text x="78" y="284" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">$900</tspan></text>
        <text x="78" y="326" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">$600 extra and</tspan><tspan x="78" dy="28">one-company risk</tspan></text>
        <path d="M78 396H336" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
        <circle cx="39" cy="431" r="7" fill="#24664e" stroke="#24664e" stroke-width="1.5"/>
        <text x="78" y="437" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="78" dy="0">Decision check</tspan></text>
        <text x="78" y="480" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="78" dy="0">Pause and review</tspan></text>
        <text x="78" y="522" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="78" dy="0">Name the evidence and the</tspan><tspan x="78" dy="28">goal paying for it</tspan></text>
        
      </g></g>
</svg>
