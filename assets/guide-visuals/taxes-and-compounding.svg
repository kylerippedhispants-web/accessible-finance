        <text data-text-role="value" x="616" y="48" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Instrument Serif, Georgia, serif"><tspan x="616" dy="0">$13,180</tspan></text>
        <path d="M24 67v32 M616 67v32" stroke="#d8dfd2"/>
