<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">The same interest rate, different tax treatment</title>
  <desc id="description">After ten years, the assumed taxable account holds about $13,180 at 2.8% after annual tax; the TFSA holds about $14,802 at 4%. Taxable interest: $13,180. 2.8% after assumed annual tax. TFSA interest: $14,802. 4% retained under the stated assumptions.</desc>
  <rect width="640" height="320" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="13180" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Taxable interest</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$13,180</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#dce4dc"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="84" width="505.759" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">2.8% after assumed annual tax.</tspan></text>
      </g>
<g data-value="14802" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">TFSA interest</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$14,802</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#dce4dc"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#eef3ec"/>
        <rect data-bar="true" x="36" y="208" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">4% retained under the stated assumptions.</tspan></text>
      </g></g>
</svg>
