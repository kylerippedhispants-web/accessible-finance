<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" role="img" aria-labelledby="title description">
  <title id="title">The same interest rate, different tax treatment</title>
  <desc id="description">After ten years, the assumed taxable account holds about $13,180 at 2.8% after annual tax; the TFSA holds about $14,802 at 4%. Taxable interest: $13,180. 2.8% after assumed annual tax. TFSA interest: $14,802. 4% retained under the stated assumptions.</desc>
  <rect width="640" height="304" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g data-value="13180">
        <text x="32" y="56" font-size="34" font-weight="600">Taxable interest</text>
        <text x="608" y="96" text-anchor="end" font-size="34" font-weight="600" fill="#1d6b45">$13,180</text>
        <rect x="32" y="114" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="114" width="512.882" height="20" rx="4" fill="#1d6b45"/>
      </g>
<g data-value="14802">
        <text x="32" y="184" font-size="34" font-weight="600">TFSA interest</text>
        <text x="608" y="224" text-anchor="end" font-size="34" font-weight="600" fill="#8b642b">$14,802</text>
        <rect x="32" y="242" width="576" height="20" rx="4" fill="#efede6"/>
        <rect x="32" y="242" width="576.000" height="20" rx="4" fill="#8b642b"/>
      </g></g>
</svg>
