<svg xmlns="http://www.w3.org/2000/svg" width="360" height="364" viewBox="0 0 360 364" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">The portfolio before and after the scenario</title>
  <desc id="description">A $10,000 portfolio split 60/40 ends at $8,280 when stocks lose 30% and bonds gain 2%, a 17.2% total decline. Starting portfolio: $10,000. $6,000 stocks + $4,000 bonds After the scenario: $8,280. $4,200 stocks + $4,080 bonds</desc>
  <rect width="360" height="364" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="10000" data-row="0">
        <text x="24" y="46" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">Starting portfolio</tspan></text>
        <text x="336" y="89" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$10,000</tspan></text>
        <path d="M24 103v32 M336 103v32" stroke="#d8dfd2"/>
        <rect x="24" y="108" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="108" width="312.000" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="159" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">$6,000 stocks + $4,000 bonds</tspan></text>
      </g>
<g data-value="8280" data-row="1">
        <text x="24" y="204" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="24" dy="0">After the scenario</tspan></text>
        <text x="336" y="247" font-size="34" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="336" dy="0">$8,280</tspan></text>
        <path d="M24 261v32 M336 261v32" stroke="#d8dfd2"/>
        <rect x="24" y="266" width="312" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="24" y="266" width="258.336" height="22" rx="3" fill="#24664e"/>
        <text x="24" y="317" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="24" dy="0">$4,200 stocks + $4,080 bonds</tspan></text>
      </g></g>
</svg>
