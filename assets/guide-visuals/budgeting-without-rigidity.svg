<svg xmlns="http://www.w3.org/2000/svg" width="640" height="549" viewBox="0 0 640 549" data-layout="bars" role="img" aria-labelledby="title description">
  <title id="title">A simple plan for $4,200 a month</title>
  <desc id="description">The monthly budget assigns $2,500 to essentials, $300 to irregular bills, $500 to goals, and $900 to flexible spending. Essentials: $2,500. Includes minimum debt payments Irregular bills: $300. $3,600 annual total divided by 12 Savings goals: $500. Chosen priorities Flexible spending: $900. About $208 a week, averaged over a year</desc>
  <rect width="640" height="549" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-value="2500" data-row="0">
        <text x="36" y="58" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Essentials</tspan></text>
        <text x="604" y="60" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$2,500</tspan></text>
        <path d="M36 79v32 M604 79v32" stroke="#d8dfd2"/>
        <rect x="36" y="84" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="84" width="568.000" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="135" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">Includes minimum debt payments</tspan></text>
      </g>
<g data-value="300" data-row="1">
        <text x="36" y="182" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Irregular bills</tspan></text>
        <text x="604" y="184" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$300</tspan></text>
        <path d="M36 203v32 M604 203v32" stroke="#d8dfd2"/>
        <rect x="36" y="208" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="208" width="68.160" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="259" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">$3,600 annual total divided by 12</tspan></text>
      </g>
<g data-value="500" data-row="2">
        <text x="36" y="306" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Savings goals</tspan></text>
        <text x="604" y="308" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$500</tspan></text>
        <path d="M36 327v32 M604 327v32" stroke="#d8dfd2"/>
        <rect x="36" y="332" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="332" width="113.600" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="383" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">Chosen priorities</tspan></text>
      </g>
<g data-value="900" data-row="3">
        <text x="36" y="430" font-size="21" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="36" dy="0">Flexible spending</tspan></text>
        <text x="604" y="432" font-size="32" font-weight="400" fill="#24664e" text-anchor="end" font-family="Georgia, Times New Roman, serif"><tspan x="604" dy="0">$900</tspan></text>
        <path d="M36 451v32 M604 451v32" stroke="#d8dfd2"/>
        <rect x="36" y="456" width="568" height="22" rx="3" fill="#e6eadc"/>
        <rect data-bar="true" x="36" y="456" width="204.480" height="22" rx="3" fill="#24664e"/>
        <text x="36" y="507" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="36" dy="0">About $208 a week, averaged over a year</tspan></text>
      </g></g>
</svg>
