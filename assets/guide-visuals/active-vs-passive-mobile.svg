<svg xmlns="http://www.w3.org/2000/svg" width="360" height="398" viewBox="0 0 360 398" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">Gross performance is only the start</title>
  <desc id="description">The passive fund earns 6% before a 0.2% cost, leaving about 5.8%. The active fund earns 7.2% before a 1.5% cost, leaving about 5.7%. Passive example: 5.8% net. 6.0% gross − 0.2% cost. Active example: 5.7% net. 7.2% gross − 1.5% cost.</desc>
  <rect width="360" height="398" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="24" y="24" width="312" height="167" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 38h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="67" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">Passive example</tspan></text>
        <text x="46" y="113" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">5.8% net</tspan></text>
        <text x="46" y="160" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">6.0% gross − 0.2% cost.</tspan></text>
      </g>
<g data-row="1">
        <rect x="24" y="207" width="312" height="167" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M46 221h28" stroke="#24664e" stroke-width="2"/>
        <text x="46" y="250" font-size="22" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="46" dy="0">Active example</tspan></text>
        <text x="46" y="296" font-size="34" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="46" dy="0">5.7% net</tspan></text>
        <text x="46" y="343" font-size="21" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="46" dy="0">7.2% gross − 1.5% cost.</tspan></text>
      </g></g>
</svg>
