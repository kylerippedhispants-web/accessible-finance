        <text x="90" y="97" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="90" dy="0">$40</tspan></text>
        <text x="90" y="139" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">Interest payment.</tspan></text>
        <path d="M90 177H604" stroke="#d8dfd2"/>
      </g>
<g data-row="1">
        <path d="M51 226V359" stroke="#b7cbbd" stroke-width="1.5"/>
        <path d="m47 354 4 5 4-5" fill="none" stroke="#24664e" stroke-width="1.5"/>
        <circle cx="51" cy="212" r="7" fill="#fffdf6" stroke="#24664e" stroke-width="1.5"/>
        <text x="90" y="218" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="90" dy="0">End of year 2</tspan></text>
        <text x="90" y="258" font-size="36" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="90" dy="0">$40</tspan></text>
        <text x="90" y="300" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="90" dy="0">Interest payment.</tspan></text>
        <path d="M90 338H604" stroke="#d8dfd2"/>
      </g>
<g data-row="2">
        
