<svg xmlns="http://www.w3.org/2000/svg" width="640" height="555" viewBox="0 0 640 555" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">Rule of 72 versus exact doubling time</title>
  <desc id="description">At 4%: 18 years by the shortcut, 17.67 exact. At 6%: 12 years versus 11.90. At 8%: 9 years versus 9.01. At 4% a year: 18 years. Exact: about 17.67 years. At 6% a year: 12 years. Exact: about 11.90 years. At 8% a year: 9 years. Exact: about 9.01 years.</desc>
  <rect width="640" height="555" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="36" y="36" width="568" height="145" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M58 50h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="79" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">At 4% a year</tspan></text>
        <text x="58" y="122" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="58" dy="0">18 years</tspan></text>
        <text x="58" y="169" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">Exact: about 17.67 years.</tspan></text>
      </g>
<g data-row="1">
        <rect x="36" y="197" width="568" height="145" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M58 211h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="240" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">At 6% a year</tspan></text>
        <text x="58" y="283" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="58" dy="0">12 years</tspan></text>
        <text x="58" y="330" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">Exact: about 11.90 years.</tspan></text>
      </g>
<g data-row="2">
        <rect x="36" y="358" width="568" height="145" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M58 372h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="401" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">At 8% a year</tspan></text>
        <text x="58" y="444" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="58" dy="0">9 years</tspan></text>
        <text x="58" y="491" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">Exact: about 9.01 years.</tspan></text>
      </g></g>
</svg>
