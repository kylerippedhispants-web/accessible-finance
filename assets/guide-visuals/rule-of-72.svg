<svg xmlns="http://www.w3.org/2000/svg" width="640" height="593" viewBox="0 0 640 593" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">Rule of 72 versus exact doubling time</title>
  <desc id="description">At 4%: 18 years by the shortcut, 17.67 exact. At 6%: 12 years versus 11.90. At 8%: 9 years versus 9.01. At 4% a year: 18 years. Exact: about 17.67 years. At 6% a year: 12 years. Exact: about 11.90 years. At 8% a year: 9 years. Exact: about 9.01 years.</desc>
  <metadata>Embedded subsets of Inter and Instrument Serif, licensed under SIL OFL 1.1. Copyright and license records: https://accessible-finance.com/assets/fonts/Inter-OFL.txt and https://accessible-finance.com/assets/fonts/Instrument-Serif-OFL.txt</metadata>
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
  </style>
  <rect width="640" height="593" fill="#f8f3e7"/>
  <g font-family="Inter, sans-serif"><g data-row="0">
        <rect x="36" y="36" width="568" height="163" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M58 50h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="79" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">At 4% a year</tspan></text>
        <text x="58" y="122" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="58" dy="0">18 years</tspan></text>
        <text x="58" y="169" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">Exact: about 17.67 years.</tspan></text>
      </g>
<g data-row="1">
        <rect x="36" y="215" width="568" height="163" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M58 229h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="258" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">At 6% a year</tspan></text>
        <text x="58" y="301" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="58" dy="0">12 years</tspan></text>
        <text x="58" y="348" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">Exact: about 11.90 years.</tspan></text>
      </g>
<g data-row="2">
        <rect x="36" y="394" width="568" height="163" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M58 408h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="437" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">At 8% a year</tspan></text>
        <text x="58" y="480" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Instrument Serif, Georgia, serif"><tspan x="58" dy="0">9 years</tspan></text>
        <text x="58" y="527" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">Exact: about 9.01 years.</tspan></text>
