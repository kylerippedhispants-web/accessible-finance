<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432" role="img" aria-labelledby="title description">
  <title id="title">A $4,000 deductible contribution</title>
  <desc id="description">At an assumed 30% marginal rate, a $4,000 deductible contribution reduces tax by $1,200, leaving an after-tax cash cost of $2,800. Into the RRSP: $4,000. Contribution, with sufficient room Tax reduction: $1,200. $4,000 × illustrative 30% rate After-tax cash cost: $2,800. $4,000 minus the tax reduction</desc>
  <rect width="640" height="432" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g>
      <rect x="24" y="24" width="592" height="108" rx="10" fill="#eef5f0"/>
      
      <circle cx="58" cy="60" r="18" fill="#1d6b45"/>
      <text x="58" y="67" font-size="20" text-anchor="middle" fill="#fff">1</text>
      <text x="92" y="60" font-size="32" font-weight="600">Into the RRSP</text>
      <text x="92" y="103" font-size="36" fill="#1d6b45">$4,000</text>
    </g>
<g>
      <rect x="24" y="152" width="592" height="108" rx="10" fill="#f4f0e7"/>
      
      <circle cx="58" cy="188" r="18" fill="#8b642b"/>
      <text x="58" y="195" font-size="20" text-anchor="middle" fill="#fff">2</text>
      <text x="92" y="188" font-size="32" font-weight="600">Tax reduction</text>
      <text x="92" y="231" font-size="36" fill="#8b642b">$1,200</text>
    </g>
<g>
      <rect x="24" y="280" width="592" height="108" rx="10" fill="#eef5f0"/>
      
      <circle cx="58" cy="316" r="18" fill="#1d6b45"/>
      <text x="58" y="323" font-size="20" text-anchor="middle" fill="#fff">3</text>
      <text x="92" y="316" font-size="32" font-weight="600">After-tax cash cost</text>
      <text x="92" y="359" font-size="36" fill="#1d6b45">$2,800</text>
    </g></g>
</svg>
