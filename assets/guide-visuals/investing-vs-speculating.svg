<svg xmlns="http://www.w3.org/2000/svg" width="640" height="259" viewBox="0 0 640 259" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">What must go right?</title>
  <desc id="description">The investment case relies on many businesses over 20 years. The speculative case relies on a price jump in one stock next week. Diversified fund: 20-year goal. Return depends on many businesses over time. Single-stock trade: Next week. Return depends on a near-term price jump.</desc>
  <rect width="640" height="259" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="36" y="36" width="274" height="187" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M56 50h28" stroke="#24664e" stroke-width="2"/>
        <text x="56" y="79" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="56" dy="0">Diversified fund</tspan></text>
        <text x="56" y="122" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="56" dy="0">20-year goal</tspan></text>
        <text x="56" y="169" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="56" dy="0">Return depends on many</tspan><tspan x="56" dy="24">businesses over time.</tspan></text>
      </g>
<g data-row="1">
        <rect x="330" y="36" width="274" height="187" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M350 50h28" stroke="#24664e" stroke-width="2"/>
        <text x="350" y="79" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="350" dy="0">Single-stock trade</tspan></text>
        <text x="350" y="122" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="350" dy="0">Next week</tspan></text>
        <text x="350" y="169" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="350" dy="0">Return depends on a</tspan><tspan x="350" dy="24">near-term price jump.</tspan></text>
      </g></g>
</svg>
