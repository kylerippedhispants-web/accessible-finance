<svg xmlns="http://www.w3.org/2000/svg" width="640" height="555" viewBox="0 0 640 555" data-layout="compare" role="img" aria-labelledby="title description">
  <title id="title">Rebalancing with new money</title>
  <desc id="description">Before the contribution, stocks are $7,200 and bonds $3,800. Adding $1,000 to bonds makes the portfolio $7,200 stocks and $4,800 bonds, restoring a 60/40 mix. Before contributing: 65.5% / 34.5%. $7,200 stocks + $3,800 bonds New money to bonds: $1,000. No sale is needed in this example After contributing: 60% / 40%. $7,200 stocks + $4,800 bonds</desc>
  <rect width="640" height="555" fill="#f8f3e7"/>
  <g font-family="Arial, Helvetica, sans-serif"><g data-row="0">
        <rect x="36" y="36" width="568" height="145" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M58 50h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="79" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">Before contributing</tspan></text>
        <text x="58" y="122" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="58" dy="0">65.5% / 34.5%</tspan></text>
        <text x="58" y="169" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">$7,200 stocks + $3,800 bonds</tspan></text>
      </g>
<g data-row="1">
        <rect x="36" y="197" width="568" height="145" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M58 211h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="240" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">New money to bonds</tspan></text>
        <text x="58" y="283" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="58" dy="0">$1,000</tspan></text>
        <text x="58" y="330" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">No sale is needed in this example</tspan></text>
      </g>
<g data-row="2">
        <rect x="36" y="358" width="568" height="145" rx="8" fill="#fffdf6" stroke="#d8dfd2"/>
        <path d="M58 372h28" stroke="#24664e" stroke-width="2"/>
        <text x="58" y="401" font-size="20" font-weight="500" fill="#203c32" text-anchor="start"><tspan x="58" dy="0">After contributing</tspan></text>
        <text x="58" y="444" font-size="32" font-weight="400" fill="#24664e" text-anchor="start" font-family="Georgia, Times New Roman, serif"><tspan x="58" dy="0">60% / 40%</tspan></text>
        <text x="58" y="491" font-size="18" font-weight="400" fill="#52645b" text-anchor="start"><tspan x="58" dy="0">$7,200 stocks + $4,800 bonds</tspan></text>
      </g></g>
</svg>
