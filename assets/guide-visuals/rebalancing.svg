<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432" role="img" aria-labelledby="title description">
  <title id="title">Rebalancing with new money</title>
  <desc id="description">Before the contribution, stocks are $7,200 and bonds $3,800. Adding $1,000 to bonds makes the portfolio $7,200 stocks and $4,800 bonds, restoring a 60/40 mix. Before contributing: 65.5% / 34.5%. $7,200 stocks + $3,800 bonds New money to bonds: $1,000. No sale is needed in this example After contributing: 60% / 40%. $7,200 stocks + $4,800 bonds</desc>
  <rect width="640" height="432" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1816"><g>
      <rect x="24" y="24" width="592" height="108" rx="10" fill="#eef5f0"/>
      
      <circle cx="58" cy="60" r="18" fill="#1d6b45"/>
      <text x="58" y="67" font-size="20" text-anchor="middle" fill="#fff">1</text>
      <text x="92" y="60" font-size="32" font-weight="600">Before contributing</text>
      <text x="92" y="103" font-size="36" fill="#1d6b45">65.5% / 34.5%</text>
    </g>
<g>
      <rect x="24" y="152" width="592" height="108" rx="10" fill="#f4f0e7"/>
      
      <circle cx="58" cy="188" r="18" fill="#8b642b"/>
      <text x="58" y="195" font-size="20" text-anchor="middle" fill="#fff">2</text>
      <text x="92" y="188" font-size="32" font-weight="600">New money to bonds</text>
      <text x="92" y="231" font-size="36" fill="#8b642b">$1,000</text>
    </g>
<g>
      <rect x="24" y="280" width="592" height="108" rx="10" fill="#eef5f0"/>
      
      <circle cx="58" cy="316" r="18" fill="#1d6b45"/>
      <text x="58" y="323" font-size="20" text-anchor="middle" fill="#fff">3</text>
      <text x="92" y="316" font-size="32" font-weight="600">After contributing</text>
      <text x="92" y="359" font-size="36" fill="#1d6b45">60% / 40%</text>
    </g></g>
</svg>
